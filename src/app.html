function openSheet(num, tab = "info"){
  const T = G(), m = T.byNum.get(num); if (!m) return;
  if (!team().includes(num)) tab = "info";
  const inTeam = team().includes(num), og = genOf(baseOf(num));
  const weak = T.types.map(a => ({a, e: eff(a, m.types, T.chart)})).filter(x => x.e >= 2);
  const immune = T.types.filter(a => eff(a, m.types, T.chart) === 0);
  const sh = inTeam && isShinyMember(state.team, num);
  const nick = inTeam ? memberOf(state.team, num).nick : "";
  const head = `<div class="hero">${spr(m.num, {sh, zoom:true})}<div><div class="meta">${fmtNo(m.num)} · Gen ${ROMAN[og]} ${REGION(og)}${nick ? " · " + esc(m.name) : ""}</div><h3 class="mt" id="modalTitle">${inTeam ? ballImg(ballOf(state.team, num), "ball-ic lg") : ""}${esc(nick || m.name)}</h3>${typeBadges(m.types)}</div></div>
    ${inTeam ? `<div class="segrow sheet-tabs" role="tablist" aria-label="Sections"><button type="button" role="tab" data-stab="info" aria-pressed="${tab === "info"}" aria-selected="${tab === "info"}">Overview</button><button type="button" role="tab" data-stab="build" aria-pressed="${tab === "build"}" aria-selected="${tab === "build"}">Personalize</button></div>` : ""}`;
  if (tab === "build") {
    const md = openModal(head + buildHTML(num));
    md.querySelectorAll("[data-stab]").forEach(b => b.onclick = () => openSheet(num, b.dataset.stab));
    wireBuild(md, num); return;
  }
  const md = openModal(head + `
    <div class="cov-h">Base stats</div>${statsHTML(m)}
    <div class="cov-h">Weak to</div><div class="uncov">${weak.map(x=>`<span class="tb" style="${tStyle(x.a)}">${x.a}${x.e>=4?" ×4":""}</span>`).join("") || '<span class="meta">Nothing</span>'}</div>
    ${immune.length ? `<div class="cov-h">Immune to</div><div class="uncov">${immune.map(a=>`<span class="tb" style="${tStyle(a)}">${a}</span>`).join("")}</div>` : ""}
    <p class="note">${state.team === "g1" ? "Gen I used a single Special stat for both attacking and defending. Types and matchups follow Gen I rules." : `Types, stats and matchups follow ${T.rules} rules.`}</p>
    <div class="actions">
      <button class="btn ${inTeam?"":"primary"}" type="button" id="sheetToggle">${inTeam ? "Remove from team" : "Add to team"}</button>
      <button class="btn" type="button" id="sheetFav" aria-pressed="${isFav(num)}">${isFav(num) ? "♥ Favorited" : "♡ Favorite"}</button>
      ${inTeam ? `<button class="btn" type="button" id="sheetShy" aria-pressed="${sh}" ${state.shiny ? 'disabled title="Shiny is on for every sprite"' : ""}>${sh ? "✦ Shiny on" : "✦ Make shiny"}</button>` : ""}

  const shyB = md.querySelector("#sheetShy"); if (shyB) shyB.onclick = () => { toggleMemberShiny(num); openSheet(num); };

}

// ---------- drag to reorder (tabs, team slots, tab editor) ----------

    st = {el, id:el.dataset.sid, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, touch:e.pointerType !== "mouse", active:false};

  });

    if (!st) return;
    st.x = e.clientX; st.y = e.clientY;

    if (!st.active) { if (st.touch) { if (moved > 10) cancel(); return; } if (moved < 6) return; begin(); }
    e.preventDefault();
    st.ghost.style.left = (st.x - st.ox) + "px"; st.ghost.style.top = (st.y - st.oy) + "px";
    // auto-scroll a scrolling parent near its edge
    const sc = root.closest(".tabs-wrap, .modal, .team-panel");
    if (sc) { const rr = sc.getBoundingClientRect(); if (axis === "x") { if (st.x < rr.left + 40) sc.scrollLeft -= 12; else if (st.x > rr.right - 40) sc.scrollLeft += 12; } else { if (st.y < rr.top + 40) sc.scrollTop -= 10; else if (st.y > rr.bottom - 40) sc.scrollTop += 10; } }

    items().forEach(i => i.classList.remove("drop-before", "drop-after"));
    st.target = null;
    if (best) { const r = best.r, aft = axis === "y" ? st.y > r.top + r.height/2 : (Math.abs(st.y - (r.top + r.height/2)) < r.height/2 ? st.x > r.left + r.width/2 : st.y > r.top + r.height/2); best.it.classList.add(aft ? "drop-after" : "drop-before"); st.target = {id:best.it.dataset.sid, after:aft}; }
  }, {passive:false});
  window.addEventListener("touchmove", e => { if (st && st.active) e.preventDefault(); }, {passive:false});

    if (!st) return;

    cancel();
    if (wasActive) { suppress = true; setTimeout(() => suppress = false, 50); if (s0.target && s0.target.id !== s0.id) onDrop(s0.id, s0.target.id, s0.target.after); }

}

function openTrainerPicker(){
  const cur = trainerOf(state.team);
  const md = openModal(`<h3 class="mt" id="modalTitle">Choose a trainer</h3>
    <p class="note">For your ${esc(G().title.replace(" dream team",""))} team. ${TRAINERS.length} trainers, shown as ${state.mode === "2d" ? "pixel sprites" : "3D portraits"}.</p>
    <input class="search tsearch" id="trSearch" type="search" placeholder="Search trainers" autocomplete="off" aria-label="Search trainers">
    <div id="trList"></div>`, {wide:true});
  const draw = () => {
    const q = md.querySelector("#trSearch").value.trim().toLowerCase();
    const match = i => !q || TRAINERS[i].toLowerCase().includes(q);
    const pro = PROTAG.map(n => TR_BY_NAME.get(n)).filter(i => i !== undefined && match(i));
    const proSet = new Set(pro);
    const rest = TRAINERS.map((_,i) => i).filter(i => !proSet.has(i) && match(i));
    const cardT = i => `<button class="tcard${i === cur ? " sel" : ""}" type="button" data-pick="${i}" aria-pressed="${i === cur}">${trImg(i)}<span>${esc(TRAINERS[i])}</span></button>`;
    md.querySelector("#trList").innerHTML =
      (pro.length ? `<div class="tsect">Protagonists</div><div class="tgrid">${pro.map(cardT).join("")}</div>` : "") +
      (rest.length ? `<div class="tsect">${q ? "Other trainers" : "Gym Leaders, Champions, rivals and more"}</div><div class="tgrid">${rest.map(cardT).join("")}</div>` : "") +
      (!pro.length && !rest.length ? `<p class="meta">No trainer matches “${esc(q)}”.</p>` : "");
    paintAll(md.querySelector("#trList"));
  };
  md.querySelector("#trSearch").addEventListener("input", draw);
  md.querySelector("#trList").addEventListener("click", e => {
    const b = e.target.closest("[data-pick]"); if (!b) return;
    snap("Changed trainer"); state.trainers[state.team] = +b.dataset.pick; touched(); save();
    closeModal(); renderTeam(); toast(`${TRAINERS[+b.dataset.pick]} now leads this team.`);
  });
  draw();
}

  const u = S.h / 100, Y = f => S.y + S.h * f;
  const K = {u, Y, S, pixel, W:V.W, H:V.H, ctx,
    vgrad(y0, y1, stops, x0 = 0, x1 = V.W){
      y0 = Math.floor(y0); y1 = Math.ceil(y1); const h = y1 - y0; if (h <= 0) return;
      if (!pixel) { const g = ctx.createLinearGradient(0,y0,0,y1); for (const [o,c] of stops) g.addColorStop(o,c); ctx.fillStyle = g; ctx.fillRect(x0,y0,x1-x0,h); return; }

    },
    glow(x, y, r, c, a = 1){

    },
    disc(x, y, r, c){ ctx.fillStyle = c; ctx.beginPath(); ctx.arc(pixel ? Math.round(x) : x, pixel ? Math.round(y) : y, Math.max(pixel ? 1 : .5, r), 0, 7); ctx.fill(); },
    poly(pts, c){ ctx.fillStyle = c; ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); ctx.fill(); },
    ridge(base, amp, seed, freq, c, bottom = V.H){

      ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, bottom);
      for (let x = 0; x <= V.W + step; x += step) { const q = x / S.h * freq * 3; const n = Math.sin(q + p[0])*.55 + Math.sin(q*2.1 + p[1])*.3 + Math.sin(q*4.7 + p[2])*.15; ctx.lineTo(x, Math.round(base - amp * (.5 + .5*n))); }

    peaks(base, hgt, n, seed, c, snow){

        K.poly([[px, base - ph], [px + w*.3, base - ph*.66], [px + w*.5, base - ph*.48], [px + w, base + 1], [px + w*.2, base + 1]], "rgba(0,0,0,.12)");
      }
    },
    pines(base, size, spacing, seed, c, trunk){
      const R = rng(seed);
      for (let x = -spacing; x < V.W + spacing; x += spacing * (.6 + R()*.8)) {
        const h = size * (.7 + R()*.6), w = h * .38, bx = x + R()*spacing*.3;

    },
    star4(x, y, r, c, a){
      if (a <= .02) return;
      ctx.fillStyle = rgba(c, a);
      if (pixel) { const X = Math.round(x), Yy = Math.round(y), R = Math.max(1, Math.round(r)); ctx.fillRect(X - R, Yy, R*2+1, 1); ctx.fillRect(X, Yy - R, 1, R*2+1); return; }

    },
  };

}
const SKY = {
  day:[[0,"#4f9cf5"],[.7,"#a9d8ff"],[1,"#e4f4ff"]],
  sunset:[[0,"#2c2a6e"],[.45,"#c3608a"],[.8,"#ff9d6c"],[1,"#ffd38a"]],
  night:[[0,"#050822"],[.7,"#16204e"],[1,"#2b3a78"]]
};
const TINT = {sunset:"rgba(255,120,70,.20)", night:"rgba(14,22,80,.55)"};
function skyBox(K, tod, hz, seed){
  K.vgrad(0, K.Y(hz) + K.u*4, SKY[tod]);
  const R = rng(seed);
  if (tod === "night") {
    for (let i = 0; i < 160; i++) { const x = R()*K.W, y = R()*K.Y(hz), r = (R()*.18 + .05)*K.u; K.disc(x, y, r, rgba("#ffffff", .4 + R()*.6)); }
    const mx = K.W*.78, my = K.Y(.16); K.glow(mx, my, K.u*16, "#9fb4ff", .35); K.disc(mx, my, K.u*4.4, "#f4f1de"); K.disc(mx + K.u*1.4, my - K.u*.8, K.u*.9, "#e2ddc4"); K.disc(mx - K.u*1.2, my + K.u*1.2, K.u*.6, "#e2ddc4");
  } else if (tod === "sunset") { const sx = K.W*.68, sy = K.Y(hz) - K.u*4; K.glow(sx, sy, K.u*40, "#ffb36b", .55); K.disc(sx, sy, K.u*7, "#ffe2a0"); }
  else { const sx = K.W*.8, sy = K.Y(.12); K.glow(sx, sy, K.u*22, "#fff6c9", .6); K.disc(sx, sy, K.u*4.2, "#fffbe8"); }
}
function clouds(K, tod, t, seed, y0, y1, n = 6, a = .9){
  const R = rng(seed), c = tod === "night" ? "#5a6896" : tod === "sunset" ? "#ffd2c0" : "#ffffff", span = K.W + K.u*80;
  for (let i = 0; i < n; i++) { const s = K.u*(2.4 + R()*3), sp = (.6 + R())*K.u*.0025, x = ((R()*span + t*sp) % span) - K.u*40, y = K.Y(y0 + R()*(y1-y0)); K.cloud(x, y, s, c, a*(.6 + R()*.4)); }
}

const undoStack = [];
const redoStack = [];
const snapData = () => JSON.stringify({teams:state.teams, teamShiny:state.teamShiny, members:state.members, trainers:state.trainers, custom:state.custom, scenes:state.scenes, notes:state.notes, hidden:state.hidden, order:state.order});

}
function undo(){ stepHistory(undoStack, redoStack, "Undid"); }
function redo(){ stepHistory(redoStack, undoStack, "Redid"); }
function stepHistory(from, to, verb){
  const s = from.pop(); if (!s) { toast(verb === "Undid" ? "Nothing to undo." : "Nothing to redo."); renderUndo(); return; }
  to.push({label:s.label, team:state.team, data:snapData()});
  const before = JSON.stringify(state.custom);
  Object.assign(state, JSON.parse(s.data)); rebuildTeams();
  const customChanged = before !== JSON.stringify(state.custom);
  const switched = s.team !== state.team && TEAM_BY.has(s.team);
  if (!TEAM_BY.has(state.team)) fixCurrent();
  if (switched) { state.hidden = state.hidden.filter(x => x !== s.team); state.team = s.team; }
  save();
  if (!$("app").hidden) { if (switched || customChanged) renderAll(); else { renderTabs(); renderTeam(); syncSelection(); if (state.f.free) renderGrid(); } }
  else if (!$("start").hidden) startStage.load();

}
function renderUndo(){
  const b = $("undoBtn"); if (!b) return;
  b.disabled = !undoStack.length;

}

document.addEventListener("keydown", e => {

// ================= SHARE CODES =================
function shareCode(id){
  const t = teamOf(id); if (!t.length) return "";
  const sh = state.teamShiny[id] || [];
  return `DTD-${id}-` + t.map(n => n.toString(36) + (sh.includes(n) ? "!" : "") + (ballOf(id, n) !== "poke" ? "~" + BALL_IDS.indexOf(ballOf(id, n)).toString(36) : "")).join(".") + "@" + trainerOf(id).toString(36);
}
function parseCode(s){
  const m = String(s || "").trim().replace(/\s+/g, "").match(/^DTD-([a-z0-9]+)-([0-9a-z!~.]+?)(?:@([0-9a-z]+))?$/i); if (!m) return null;
  let id = m[1].toLowerCase(), T = TEAM_BY.get(id), fresh = false;
  if (!T && /^c[0-9a-z]+$/.test(id)) { T = TEAM_BY.get("all"); fresh = true; }
  if (!T) return null;
  const mons = [], shiny = [], balls = {};
  for (const part of m[2].toLowerCase().split(".")) {
    const p = part.match(/^([0-9a-z]+)(!)?(?:~([0-9a-z]))?$/); if (!p) return null;
    const n = parseInt(p[1], 36); if (!T.byNum.has(n) || mons.includes(n)) return null;
    mons.push(n); if (p[2]) shiny.push(n);
    if (p[3]) { const b = BALL_IDS[parseInt(p[3], 36)]; if (b) balls[n] = b; }
  }
  if (!mons.length || mons.length > (fresh ? MAXSIZE : T.size || MAX)) return null;
  const tr = m[3] ? parseInt(m[3], 36) : NaN;
  return {id: fresh ? null : id, mons, shiny, balls, tr: Number.isInteger(tr) && tr >= 0 && tr < TRAINERS.length ? tr : null};
}
function applyCode(c){
  if (!c.id) { const nc = addCustom({...ctDraft0(), name:"Shared team", size:Math.max(MAX, c.mons.length)}); if (!nc) return; c.id = nc.id; }
  const T = TEAM_BY.get(c.id);
  snap(`Loaded a ${T.card} code`);
  state.teams[c.id] = c.mons; state.teamShiny[c.id] = c.shiny;
  state.members[c.id] = Object.fromEntries(Object.entries(c.balls).map(([n, b]) => [n, {ball:b}]));
  if (c.tr !== null) state.trainers[c.id] = c.tr;
  state.hidden = state.hidden.filter(x => x !== c.id); state.team = c.id;
  touched(); save(); renderAll(); toast(`Loaded a ${T.card} team from a code.`, {undo:true});
}

    renderTeam();
  });
}

    if (foe.hp > 0 && me.hp > 0 && mv[2] === "P" && !me.status && Math.random() < .3) { const c = {"Static":"par", "Flame Body":"brn", "Poison Point":"psn", "Effect Spore":["slp","par","psn"][Math.floor(Math.random()*3)]}[foe.ability]; if (c && this.canStatus(me, c)) { ev.push({k:"msg", t:`${fw}’s ${foe.ability}!`}); this.setStatus(i, c, ev); } }
    const mg = me.ability === "Magic Guard";
    if (DRAIN[mv[0]] && me.hp > 0) this.heal(i, dmg*DRAIN[mv[0]], ev, `${this.who(1 - i, foe)} had its energy drained!`);
    if (RECOIL[mv[0]] && me.ability !== "Rock Head" && !mg) this.hurt(i, dmg*RECOIL[mv[0]], ev, `${this.who(i, me)} is damaged by recoil!`);
    if (mv === STRUGGLE) this.hurt(i, me.max/4, ev, `${this.who(i, me)} is damaged by recoil!`);
    if (me.hp > 0 && me.item === "Life Orb" && !mg) this.hurt(i, me.max/10, ev, `${this.who(i, me)} lost some of its HP!`);
    if (me.hp > 0 && foe.item === "Rocky Helmet" && mv[2] === "P" && !mg) this.hurt(i, me.max/6, ev, `${this.who(i, me)} was hurt by the Rocky Helmet!`);
    if (me.hp > 0 && SELF_DROP[mv[0]]) this.boost(i, SELF_DROP[mv[0]], ev);
    if (me.hp > 0 && SELF_BOOST[mv[0]]) this.boost(i, SELF_BOOST[mv[0]], ev);
    if (me.hp > 0 && foe.hp <= 0 && me.ability === "Moxie") this.boost(i, {atk:1}, ev, `${this.who(i, me)}’s Moxie`);
    if (me.hp > 0 && foe.hp <= 0 && me.ability === "Beast Boost") { const k = Object.keys(me.base).reduce((x, y) => me.base[y] > me.base[x] ? y : x); this.boost(i, {[k]:1}, ev, `${this.who(i, me)}’s Beast Boost`); }
  }
  statusMove(i, mv, ev){
    const me = this.get(i), nm = mv[0], fx = STATUS_FX[nm];
    if (fx) {
      const foe = this.get(1 - i), fw = this.who(1 - i, foe);
      if (mv[1] === "Electric" && effOf("Electric", foe.types) === 0) { ev.push({k:"msg", t:`It doesn’t affect ${fw}…`}); return; }
      if (POWDER.has(nm) && foe.types.includes("Grass")) { ev.push({k:"msg", t:`It doesn’t affect ${fw}…`}); return; }
      const acc = nm === "Toxic" && me.types.includes("Poison") ? 100 : mv[4] > 0 ? mv[4] : 100;
      if (Math.random()*100 >= acc) { ev.push({k:"msg", t:`${this.who(i, me)}’s attack missed!`}); return; }
      if (!this.setStatus(1 - i, fx[0], ev)) ev.push({k:"msg", t:"But it failed!"});
      return;
    }
    if (SETUP[nm]) { const s = {...SETUP[nm]}; if (s.cost) { if (me.hp <= me.max*s.cost) { ev.push({k:"msg", t:"But it failed!"}); return; } this.hurt(i, me.max*s.cost, ev); delete s.cost; } this.boost(i, s, ev); return; }
    if (HEAL[nm]) { if (me.hp >= me.max) { ev.push({k:"msg", t:`${this.who(i, me)}’s HP is full!`}); return; } this.heal(i, me.max*HEAL[nm], ev, `${this.who(i, me)} restored its HP.`); return; }
    if (FOE_DROP[nm]) { this.boost(1 - i, FOE_DROP[nm], ev); return; }
    if (nm === "Sunny Day" || nm === "Rain Dance" || nm === "Sandstorm" || nm === "Snowscape" || nm === "Hail") { const w = {"Sunny Day":"sun", "Rain Dance":"rain", "Sandstorm":"sand", "Snowscape":"snow", "Hail":"snow"}[nm]; this.weather = w; this.wTurns = 5; ev.push({k:"msg", t:WEATHER_TXT[w][0], w}); return; }
    ev.push({k:"msg", t:"But nothing happened! (That move has no effect in quick battles.)"});
  }
  endTurn(ev){
    if (this.weather) {
      if (this.weather === "sand") for (const i of [0, 1]) { const m = this.get(i); if (m.hp > 0 && !m.types.some(t => ["Rock","Ground","Steel"].includes(t)) && m.ability !== "Magic Guard" && m.ability !== "Sand Rush") this.hurt(i, m.max/16, ev, `${this.who(i, m)} is buffeted by the sandstorm!`); }
      if (--this.wTurns <= 0) { ev.push({k:"msg", t:WEATHER_TXT[this.weather][1], w:null}); this.weather = null; }
    }
    for (const i of [0, 1]) {
      const m = this.get(i); if (m.hp <= 0) continue;
      if (m.item === "Leftovers" && m.hp < m.max) this.heal(i, m.max/16, ev, `${this.who(i, m)} restored a little HP using its Leftovers!`);
      if (m.item === "Black Sludge") { if (m.types.includes("Poison")) { if (m.hp < m.max) this.heal(i, m.max/16, ev, `${this.who(i, m)} restored a little HP using its Black Sludge!`); } else this.hurt(i, m.max/8, ev, `${this.who(i, m)} is hurt by its Black Sludge!`); }
      if (m.hp > 0 && m.ability === "Speed Boost") this.boost(i, {spe:1}, ev, `${this.who(i, m)}’s Speed Boost`);
      if (m.hp > 0 && m.status && m.ability !== "Magic Guard") {
        if (m.status === "brn") this.hurt(i, m.max/16, ev, `${this.who(i, m)} was hurt by its burn!`);
        else if ((m.status === "psn" || m.status === "tox") && m.ability === "Poison Heal") this.heal(i, m.max/8, ev, `${this.who(i, m)} restored HP with Poison Heal!`);
        else if (m.status === "psn") this.hurt(i, m.max/8, ev, `${this.who(i, m)} was hurt by poison!`);
        else if (m.status === "tox") { m.toxN = Math.min(15, m.toxN + 1); this.hurt(i, m.max*m.toxN/16, ev, `${this.who(i, m)} was hurt by poison!`); }
      }
      if (m.hp > 0 && !m.status && (m.item === "Flame Orb" || m.item === "Toxic Orb")) this.setStatus(i, m.item === "Flame Orb" ? "brn" : "tox", ev);
    }
  }
  check(ev){
    for (const i of [0, 1]) if (!this.aliveIdx(i).length) { this.over = true; this.winner = 1 - i; ev.push({k:"end", winner:1 - i}); return; }
    if (this.turnNo >= 250) { const left = i => this.s[i].party.reduce((s, m) => s + m.hp/m.max, 0); this.over = true; this.winner = left(0) >= left(1) ? 0 : 1; ev.push({k:"msg", t:"Both sides are exhausted. The judges decide!"}); ev.push({k:"end", winner:this.winner}); return; }
    for (const i of [0, 1]) this.need[i] = this.get(i).hp <= 0 ? "switch" : null;
  }
  replace(i, k, ev = []){ this.s[i].act = k; this.need[i] = null; this.enter(i, ev); return ev; }
  forfeit(i){ this.over = true; this.winner = 1 - i; return [{k:"msg", t:`${this.s[i].name} forfeited the match.`}, {k:"end", winner:1 - i}]; }
}

function leagueTeam(g, name, types, ace, size, seed){
  const T = types.split("/"), R = rng(seed);
  const pool = NATBASE.filter(m => GEN_OF[m.num] <= g && m.num !== ace && !isLegend(m.num) && m.types.some(t => T.includes(t)));
  const ranked = pool.sort((a, b) => bst(a) - bst(b));
  const need = size - 1, out = [];
  if (ranked.length) {
    const q = Math.min(.92, .25 + size*.11), centre = Math.floor(q*(ranked.length - 1));
    const band = ranked.slice(Math.max(0, centre - 10), centre + 10).filter(m => size < 4 || isFE(m.num));
    const src = band.length >= need ? band : ranked;
    const pick = [...src].sort(() => R() - .5);
    for (const m of pick) { if (out.length >= need) break; if (!out.includes(m.num)) out.push(m.num); }
  }
  return [...out, ace];
}

function fkit(c, ts, pixel){
  const SQ = HM.SQ, R = v => pixel ? Math.round(v) : v;

    box(x, y, w, d, h, col, z = 0){
      const X = R(x*ts), W = R(w*ts), yb = (y + d)*ts*SQ - z*ts, top = R(y*ts*SQ - (z + h)*ts), front = R(yb - h*ts), bot = R(yb);

      else { c.fillStyle = "rgba(255,255,255,.18)"; c.fillRect(X, top, W, Math.max(1, ts*.03)); }
      return {X, W, top, front, bot};
    },
    oval(cx, cy, rx, ry, col, z = 0){ c.fillStyle = col; c.beginPath(); c.ellipse(R(cx*ts), R(cy*ts*SQ - z*ts), Math.max(1, rx*ts), Math.max(1, ry*ts*SQ), 0, 0, 7); c.fill(); },
    disc(cx, cy, r, col, z = 0){ c.fillStyle = col; c.beginPath(); c.arc(R(cx*ts), R(cy*ts*SQ - z*ts), Math.max(1, r*ts), 0, 7); c.fill(); },
    rect(x, y, w, h, col, z = 0){ c.fillStyle = col; c.fillRect(R(x*ts), R(y*ts*SQ - z*ts), Math.max(1, R(w*ts)), Math.max(1, R(h*ts))); },
    flat(x, y, w, d, col){ c.fillStyle = col; c.fillRect(R(x*ts), R(y*ts*SQ), R(w*ts), R(d*ts*SQ)); },
    poly(pts, col){ c.fillStyle = col; c.beginPath(); pts.forEach(([x, y, z = 0], i) => { const px = R(x*ts), py = R(y*ts*SQ - z*ts); i ? c.lineTo(px, py) : c.moveTo(px, py); }); c.closePath(); c.fill(); },

async function hofCardArt(cv, id, mode, tok){
  const sc = sceneOf(id, mode), t = teamOf(id), tr = trainerOf(id), pixel = mode === "2d";

function dailySet(key){
  const seed = [...key].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261), R = rng(seed), keep = Math.random, keepMode = qz.mode, keepGen = qz.gen;

}
function dailyState(){ const k = todayKey(), d = state.games.daily; return d && d.d === k ? d : (state.games.daily = {d:k, i:0, s:0, r:""}); }

const qzPool = () => qz.gen ? GENS[qz.gen - 1].mons : NATBASE;
const pickOne = a => a[Math.floor(Math.random()*a.length)];
function qzMake(){
  const P = qzPool();
  for (let tries = 0; tries < 40; tries++) {
    const a = pickOne(P);
    if (qz.mode === "sil" || qz.mode === "stat") {
      const others = shuffle(P.filter(m => m.num !== a.num && (qz.mode !== "stat" || bst(m) !== bst(a)))).slice(0, 3);
      return {a:a.num, ans:a.num, opts:shuffle([a, ...others]).map(m => m.num)};
    }
    if (qz.mode === "type") {
      const se = TYPE_ORDER.filter(t => effOf(t, a.types) >= 2), no = TYPE_ORDER.filter(t => effOf(t, a.types) <= 1);
      if (!se.length || no.length < 3) continue;
      const right = pickOne(se); return {a:a.num, ans:right, opts:shuffle([right, ...shuffle(no).slice(0, 3)])};
    }
    if (qz.mode === "typing") {
      const right = a.types.join("/"), seen = new Set([right]), wrong = [];
      for (const m of shuffle(NATBASE)) { const k = m.types.join("/"); if (!seen.has(k)) { seen.add(k); wrong.push(k); } if (wrong.length === 3) break; }

  const theirMon = n => { const M = cleanMember((data.members[vsSel.theirs] || {})[n]) || {}; return mkMon(n, {level:50, nick:M.nick, moves:(M.moves || []).map(x => MOVE_BY.get(x)), ability:M.ability, item:M.item, sh:(data.shiny[vsSel.theirs] || []).includes(n), ball:M.ball}); };

    onEnd:win => { if (win) state.games.vs.w++; else state.games.vs.l++; save(); if (win) earn(60, "Versus win"); return {text: win ? `<b>${esc(meName)}</b> wins!` : `<b>${esc(opp.name)}</b> wins!`, buttons:[["Rematch", startVersus, true], ["Back to Versus", () => openScreen("battle", "vs")]]}; }});
}

// ---- the battle view ----
const F = {b:null, cfg:null, auto:false, fast:false, timer:0, resolve:null, tok:0};
const WEATHER_LBL = {sun:"☀ Harsh sunlight", rain:"☂ Rain", sand:"≋ Sandstorm", snow:"❄ Snow"};
function startBattle(cfg){
  F.cfg = cfg; F.b = new Battle(cfg.sides); F.auto = cfg.force ? cfg.force === "auto" : state.ui.bmode === "auto"; F.fast = false; F.tok++;
  if (nav.screen === "battle" && nav.sub === "fight") renderScreen(); else openScreen("battle", "fight");
}
function renderFight(){
  const cfg = F.cfg; if (!cfg) { openScreen("battle", "menu"); return; }
  const two = state.mode === "2d", f = cfg.foe;
  const hp = side => `<div class="bt-hp ${side}"><div class="bt-row"><b class="bt-nm"></b><span class="bt-st" hidden></span><span class="bt-lv"></span></div><span class="bt-bar"><i></i></span>${side === "you" || cfg.hotseat ? `<span class="bt-num"></span>` : ""}</div>`;
  const mon = side => `<div class="bt-mon ${side}"><div class="stage"><img class="spr" alt="" draggable="false" data-hq="1"${two ? ' data-zoom="2"' : ""}></div></div>`;
  const party = (side, P) => `<div class="bt-party ${side}">${P.map((m, k) => `<span data-pk="${k}">${ballImg(m.ball)}</span>`).join("")}</div>`;
  const trHtml = f.trIdx !== undefined && f.trIdx !== null ? `<div class="stage medal"><img class="tr" data-tr="${f.trIdx}" alt="" draggable="false"></div>` : trOrEmblem(f.name, f.type);
  $("scBody").innerHTML = `<div class="bt2">
    <div class="bt-head">${trHtml}<div><span class="meta">${esc(f.title || "")}</span><h3>vs ${esc(f.name)}</h3></div></div>
    <div class="bt-field"><canvas class="bt-bg" aria-hidden="true"></canvas><span class="bt-weather" id="btWeather" hidden></span>${hp("foe")}${mon("foe")}${mon("you")}${hp("you")}${party("foe", cfg.sides[1].party)}${party("you", cfg.sides[0].party)}</div>
    <div class="bt-bottom"><div class="bt-log" id="btLog" role="log" aria-live="polite"></div><div class="bt-cmd" id="btCmd"></div></div></div>`;
  const cv = $("scBody").querySelector(".bt-bg"), V = two ? {W:320, H:180} : {W:960, H:540}; cv.width = V.W; cv.height = V.H;
  cv.getContext("2d").drawImage(paintBg(f.bg || "league", f.bg === "city" ? "night" : "day", V, {x:0, y:0, w:V.W, h:V.H}, two), 0, 0);
  paintAll($("scBody").querySelector(".bt-head"));
  // restore persisted HP for gauntlet parties
  cfg.sides[0].party.forEach((m, k) => { if (m.hp <= 0) { const pk = $("scBody").querySelector(`.bt-party.you [data-pk="${k}"]`); if (pk) pk.classList.add("out"); } });
  nav.onClick = e => onFightClick(e);
  nav.cleanup = () => { F.tok++; clearTimeout(F.timer); if (F.wake) F.wake(); if (F.resolve) { const r = F.resolve; F.resolve = null; r(null); } };
  setMusic("battle");
  // first alive Pokémon leads (gauntlet)
  for (const s of F.b.s) { const k = s.party.findIndex(m => m.hp > 0); s.act = k < 0 ? 0 : k; }
  runBattle(F.tok);
}
const sideEl = i => { const root = $("scBody"), s = i === 0 ? "you" : "foe"; return {mon:root.querySelector(`.bt-mon.${s}`), hp:root.querySelector(`.bt-hp.${s}`), party:root.querySelector(`.bt-party.${s}`)}; };
const wait = ms => new Promise(r => { F.wake = r; F.timer = setTimeout(r, F.fast ? 0 : state.ui.bspeed === "fast" ? ms*.5 : ms); });
function logLine(t){ const log = $("btLog"); if (!log) return; log.insertAdjacentHTML("beforeend", `<p>${t}</p>`); while (log.children.length > 3) log.firstElementChild.remove(); }
function setHP(i, hp, max, instant){
  const s = sideEl(i); if (!s.hp) return; const pct = Math.max(0, hp/max*100), bar = s.hp.querySelector(".bt-bar i");
  bar.style.transition = instant || F.fast ? "none" : ""; bar.style.width = pct + "%"; bar.dataset.l = pct <= 20 ? "r" : pct <= 50 ? "y" : "g";
  const num = s.hp.querySelector(".bt-num"); if (num) num.textContent = `${Math.ceil(hp)} / ${max}`;
}
function setSt(i, st){ const s = sideEl(i), t = s.hp && s.hp.querySelector(".bt-st"); if (!t) return; t.hidden = !st; t.textContent = st ? ST_TAG[st] : ""; t.dataset.st = st || ""; }
function anim(el, cls){ if (!el || F.fast) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
async function showEv(e){
  const B = F.b;
  switch (e.k) {
    case "send": {
      const s = sideEl(e.side), m = B.s[e.side].party[e.idx], img = s.mon.querySelector("img");
      img.dataset.num = m.n; if (m.sh) img.dataset.sh = "1"; else delete img.dataset.sh; paintImg(img);
      s.mon.classList.remove("faint", "hit", "lunge", "recall"); anim(s.mon, "enter");
      s.hp.querySelector(".bt-nm").textContent = m.name; s.hp.querySelector(".bt-lv").textContent = "Lv" + m.level; setHP(e.side, m.hp, m.max, true); setSt(e.side, e.st);
      s.party.querySelectorAll("[data-pk]").forEach(x => x.classList.toggle("act", +x.dataset.pk === e.idx));
      const S0 = B.s[e.side]; logLine(e.side === 0 && !F.cfg.hotseat ? `Go! <b>${esc(m.name)}</b>!` : `${esc(S0.name)} sent out <b>${esc(m.name)}</b>!`);
      if (!F.fast) Sound.play("send"); await wait(750); break;
    }
    case "st": { setSt(e.side, e.st); if (e.st && !F.fast) Sound.play("down"); break; }
    case "recall": { const s = sideEl(e.side); s.mon.classList.remove("hit", "lunge", "enter"); anim(s.mon, "recall"); logLine(esc(e.t)); await wait(450); break; }
    case "move": { const s = sideEl(e.side); anim(s.mon, "lunge"); logLine(esc(e.t)); await wait(500); break; }
    case "hp": {
      setHP(e.side, e.hp, e.max); const s = sideEl(e.side);
      if (e.hit) { anim(s.mon, "hit"); if (!F.fast) Sound.play(e.eff >= 2 ? "super" : e.eff < 1 ? "weak" : "hit"); } else if (e.heal && !F.fast) Sound.play("heal");
      await wait(650); break;
    }
    case "msg": {
      logLine(esc(e.t)); if (e.stat && !F.fast) Sound.play(e.stat.up ? "up" : "down");
      if (e.w !== undefined) { const w = $("btWeather"); if (w) { w.hidden = !e.w; w.textContent = e.w ? WEATHER_LBL[e.w] : ""; } }
      await wait(e.se ? 500 : 800); break;
    }
    case "faint": { const s = sideEl(e.side); s.mon.classList.remove("hit", "lunge", "enter"); s.mon.classList.add("faint"); const pk = s.party.querySelector(`[data-pk="${e.idx}"]`); if (pk) pk.classList.add("out"); logLine(esc(e.t)); if (!F.fast) Sound.play("faint"); await wait(900); break; }
  }
}
async function playEv(evs, tok){ let n = 0; for (const e of evs) { if (tok !== F.tok) return; await showEv(e); if (F.fast && ++n % 25 === 0) await new Promise(r => setTimeout(r, 0)); } }
const humanFor = i => F.cfg.humans[i] && !F.auto;
function ask(render){ return new Promise(res => { F.resolve = res; render(); }); }
function resolveAsk(v){ const r = F.resolve; F.resolve = null; if (r) r(v); }
async function runBattle(tok){
  const B = F.b;
  await playEv(B.start(), tok);
  while (!B.over && tok === F.tok) {
    for (const i of [0, 1]) if (!B.over && B.need[i] === "switch") {
      let k = humanFor(i) ? await askSwitch(i, true) : B.aiReplace(i);
      if (tok !== F.tok) return; if (k === null || k === undefined) k = B.aiReplace(i);
      await playEv(B.replace(i, k), tok);
    }
    if (B.over || tok !== F.tok) break;
    const ch = [null, null];
    for (const i of [0, 1]) {
      if (!humanFor(i)) { ch[i] = B.ai(i); continue; }
      if (F.cfg.hotseat) { await ask(() => renderCurtain(i)); if (tok !== F.tok) return; }
      for (;;) {
        const c = await ask(() => renderMoves(i)); if (tok !== F.tok) return;
        if (c && c.forfeit) { await playEv(B.forfeit(i), tok); break; }
        if (c && c.auto) { ch[i] = B.ai(i); break; }
        if (c && c.sw === "menu") { const k = await askSwitch(i, false); if (tok !== F.tok) return; if (k === null) continue; ch[i] = {sw:k}; break; }
        ch[i] = c; break;
      }
      if (B.over) break;
    }
    if (B.over || tok !== F.tok) break;
    renderWait();
    await playEv(B.turn(ch), tok);
  }
  if (tok === F.tok) finishBattle();
}
function renderWait(){
  const c = $("btCmd"); if (!c) return;
  c.innerHTML = `<div class="bt-acts"><button class="btn sm" type="button" data-bt="fast">${F.fast ? "Skipping…" : "Skip ▸▸"}</button>${F.cfg.humans.some(Boolean) ? `<button class="btn sm" type="button" data-bt="autotog" aria-pressed="${F.auto}">${F.auto ? "Auto: on" : "Auto: off"}</button>` : ""}</div>`;
}
function renderCurtain(i){
  const c = $("btCmd"), S = F.b.s[i];
  c.innerHTML = `<div class="bt-curtain"><p>Pass the device to <b>${esc(S.name)}</b>.</p><button class="btn primary" type="button" data-bt="ready">I’m ${esc(S.name)}, show my moves</button></div>`;
  c.querySelector("button").focus();
}
function renderMoves(i){
  const B = F.b, me = B.get(i), foe = B.get(1 - i), c = $("btCmd"), S = B.s[i];
  const canSwitch = B.aliveIdx(i).filter(k => k !== S.act).length > 0;
  c.innerHTML = `<p class="bt-q">${F.cfg.hotseat ? `<b>${esc(S.name)}:</b> ` : ""}What will <b>${esc(me.name)}</b> do?</p>
    <div class="bt-moves">${me.moves.map((mv, j) => { const dmg = isDmg(mv), sc = B.score(i, j), e = dmg && !FIXED_DMG.has(mv[0]) ? effOf(B.moveType(me, mv), foe.types) : 1;
      const fx = STATUS_FX[mv[0]];
      const hint = !dmg ? (SETUP[mv[0]] ? "Boosts stats" : HEAL[mv[0]] ? "Heals" : FOE_DROP[mv[0]] ? "Lowers foe’s stats" : fx ? (B.canStatus(foe, fx[0] === "tri" ? "brn" : fx[0]) ? ST_HINT[fx[0]] : "Won’t work now") : "No effect here") : e === 0 ? "No effect" : e >= 2 ? "Super effective" : e < 1 ? "Not very effective" : "";
      const extra = dmg && fx && fx[1] < 100 ? ` · ${fx[1]}% ${({brn:"burn", par:"paralysis", psn:"poison", tox:"poison", slp:"sleep", frz:"freeze", tri:"status"})[fx[0]]}` : "";
      return `<button class="bt-move" type="button" data-mv="${j}" style="${tStyle(mv[1] === "???" ? "Normal" : mv[1])}" ${sc < 0 ? "disabled" : ""}><b>${esc(mv[0])}</b><span>${mv[1]} · ${catName(mv)}${mv[3] ? " " + mv[3] : ""}${extra}</span>${hint ? `<em>${hint}</em>` : ""}</button>`; }).join("")}</div>
    <div class="bt-acts"><button class="btn sm" type="button" data-bt="switch" ${canSwitch ? "" : "disabled"}>Switch</button>${F.cfg.hotseat ? "" : `<button class="btn sm" type="button" data-bt="auto">Auto battle</button>`}<button class="btn sm" type="button" data-bt="run">Forfeit</button></div>`;
}
function askSwitch(i, forced){
  return ask(() => {
    const B = F.b, S = B.s[i], c = $("btCmd");
    c.innerHTML = `<p class="bt-q">${F.cfg.hotseat ? `<b>${esc(S.name)}:</b> ` : ""}${forced ? "Choose your next Pokémon." : "Switch to which Pokémon?"}</p>
      <div class="bt-sw">${S.party.map((m, k) => `<button class="bt-swb" type="button" data-sw="${k}" ${m.hp <= 0 || (k === S.act && !forced) || (forced && k === S.act) ? "disabled" : ""}>${ballImg(m.ball)}<b>${esc(m.name)}${m.status && m.hp > 0 ? ` <span class="bt-st" data-st="${m.status}">${ST_TAG[m.status]}</span>` : ""}</b><span class="bt-bar sm"><i style="width:${m.hp/m.max*100}%" data-l="${m.hp/m.max <= .2 ? "r" : m.hp/m.max <= .5 ? "y" : "g"}"></i></span><small>${m.hp > 0 ? `${m.hp}/${m.max}` : "Fainted"}</small></button>`).join("")}</div>
      <div class="bt-acts">${forced ? (F.cfg.hotseat ? "" : `<button class="btn sm" type="button" data-bt="autosw">Auto battle</button>`) : `<button class="btn sm" type="button" data-bt="cancel">Back</button>`}</div>`;
  });
}
document.addEventListener("keydown", e => {
  if (nav.screen !== "battle" || nav.sub !== "fight" || !$("modalWrap").hidden || e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[1-6]$/.test(e.key)) { const b = $("scBody").querySelectorAll(".bt-move:not([disabled]), .bt-swb:not([disabled])"), all = $("scBody").querySelectorAll(".bt-move, .bt-swb"), t = all[+e.key - 1]; if (t && !t.disabled && b.length) { e.preventDefault(); t.click(); } }
  else if (e.key === "s" || e.key === "S") { const b = $("scBody").querySelector('[data-bt="switch"]:not([disabled])'); if (b) { e.preventDefault(); b.click(); } }
});
function onFightClick(e){
  const b = e.target.closest("[data-mv], [data-sw], [data-bt], [data-res]"); if (!b) return;
  if (b.dataset.res !== undefined) { const fn = F.result && F.result[+b.dataset.res]; if (fn) { Sound.play("select"); fn(); } return; }
  if (b.dataset.mv !== undefined) { Sound.play("select"); resolveAsk({move:+b.dataset.mv}); return; }
  if (b.dataset.sw !== undefined) { Sound.play("select"); resolveAsk(+b.dataset.sw); return; }
  const a = b.dataset.bt;
  if (a === "switch") resolveAsk({sw:"menu"});
  else if (a === "cancel") resolveAsk(null);
  else if (a === "ready") resolveAsk(true);
  else if (a === "auto") { F.auto = true; resolveAsk({auto:true}); }
  else if (a === "autosw") { F.auto = true; resolveAsk(null); }
  else if (a === "autotog") { F.auto = !F.auto; renderWait(); }
  else if (a === "fast") { F.fast = true; F.auto = true; clearTimeout(F.timer); if (F.wake) F.wake(); renderWait(); }
  else if (a === "run") askConfirm("Forfeit this battle?", "It counts as a loss.", "Forfeit").then(ok => { if (ok) resolveAsk({forfeit:true}); });
}
function finishBattle(){
  const B = F.b, win = B.winner === 0, res = F.cfg.onEnd ? F.cfg.onEnd(win, B) : {text: win ? "You won!" : "You lost.", buttons:[]};
  F.fast = false; setMusic(null);
  setTimeout(() => Sound.play(win || F.cfg.hotseat ? "victory" : "lose"), 150);
  const log = $("btLog"); if (log) { log.classList.toggle("win", win); log.classList.toggle("loss", !win && !F.cfg.hotseat); logLine(res.text); }
  F.result = res.buttons.map(x => x[1]);
  const c = $("btCmd"); if (c) c.innerHTML = `<div class="bt-acts end">${res.buttons.map(([l, , p], k) => `<button class="btn${p ? " primary" : ""}" type="button" data-res="${k}">${esc(l)}</button>`).join("")}</div>`;
  checkAch();
}

const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;

  }
}

}

addEventListener("unhandledrejection", noteError);

{
