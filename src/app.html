// first sign-in with no cloud save yet: offer to bring a save file from this device into the account
function bringChoices(b){
  const out = [];
  if (b && b.guest) out.push({key:"guest", name:"This guest session", data:b.guest});
  for (const p of accounts.list) {
    if (p.sb) continue;
    let d = null; try { d = JSON.parse(ls.get(PKEY(p.id)) || "null"); } catch(e){}
    if (d && d.teams) out.push({key:p.id, name:p.name, data:d, updated:p.updated, first:p.id === (b && b.prev)});
  }
  return out.sort((a, b2) => (b2.first ? 1 : 0) - (a.first ? 1 : 0) || (b2.updated || 0) - (a.updated || 0));
}
function bringOverModal(list){
  SB.status = "checking"; renderAcct();
  let chosen = false;
  const md = openModal(`<h3 class="mt" id="modalTitle">Bring a save into your account?</h3>
    <p>Your online account is new. Pick a save file from this device to carry on with it everywhere, or start fresh.</p>
    <div class="sync-pick">${list.map((c, i) => `<button class="sync-opt" type="button" data-bring="${i}"><b>${esc(c.name)}</b><span>${sumHTML(saveSummary(c.data))}${c.updated ? `<br>Played ${fmtAgo(c.updated)}` : ""}</span></button>`).join("")}
    <button class="sync-opt" type="button" data-bring="fresh"><b>Start fresh</b><span>A brand-new adventure</span></button></div>
    <p class="note">The save file stays on this device too. Download a backup any time from your account menu.</p>`, {onClose:() => { if (!chosen) sbUpload(); }});
  md.onclick = e => {
    const b = e.target.closest("[data-bring]"); if (!b) return;
    chosen = true; closeModal();
    if (b.dataset.bring !== "fresh") {
      const c = list[+b.dataset.bring];
      resetState(); applySaved(c.data); state.name = state.name || profile.name; save(); rerenderVisible(); toast(`${c.name}’s progress is now in your account.`);
    }
    sbUpload();
  };
}

// ---- syncing ----
async function sbStart(){
  const me0 = profile; if (!me0 || !me0.sb) return;
  SB.status = "checking"; renderAcct();
  const c = await sbLoad();
  if (profile !== me0) return;
  if (!c) { SB.status = "offline"; renderAcct(); return; }
  try {
    const {data:{session}} = await c.auth.getSession();
    if (profile !== me0) return;
    if (!session || session.user.id !== me0.sb) { SB.status = "signedout"; renderAcct(); return; }
    SB.user = session.user;
    if (!SB.prof || SB.prof.id !== me0.sb) { const p = await c.from("profiles").select("*").eq("id", me0.sb).maybeSingle(); if (p.data) SB.prof = p.data; }
    if (SB.prof) { me0.uname = SB.prof.username; me0.code = SB.prof.friend_code; saveAccounts(); }
    const r = await c.from("saves").select("data, version, updated_at, device").eq("user_id", me0.sb).maybeSingle();
    if (profile !== me0) return;
    if (r.error) throw r.error;
    const cloud = r.data;
    if (!cloud) {
      const list = bringChoices(SB.bring); SB.bring = null;
      if (list.length && !me0.sbVer) { bringOverModal(list); return; }
      me0.sbVer = 0; await sbUpload(me0); return;
    }
    SB.bring = null;
    if (cloud.version === me0.sbVer) { if (me0.sbDirty) await sbUpload(me0); else { SB.status = "synced"; renderAcct(); sbAfterSync(); } return; }
    if (!me0.sbDirty) { sbPull(cloud); return; }
    syncConflict(cloud);
  } catch(e){ if (profile === me0) { SB.status = isAuthErr(e) ? "signedout" : "offline"; renderAcct(); } }
}
function sbPull(cloud){
  SB.quiet = true; applySaved(cloud.data); save(); SB.quiet = false;
  profile.sbVer = cloud.version; profile.sbDirty = false; saveAccounts();
  SB.status = "synced"; renderAcct(); rerenderVisible(); sbAfterSync();
}
function sbQueue(){
  if (!profile || !profile.sb || !SB.client || ["conflict", "signedout", "checking", "toobig"].includes(SB.status)) return;
  clearTimeout(SB.timer);
  if (SB.status !== "saving") { SB.status = "saving"; renderAcct(); }
  SB.timer = setTimeout(() => sbUpload(), 4000);
}
async function sbUpload(meArg){
  const me0 = meArg || profile;
  if (!me0 || !me0.sb || !SB.client) return;
  if (SB.busy) { SB.again = true; return; }
  clearTimeout(SB.timer);
  const data = me0 === profile ? persisted() : JSON.parse(ls.get(PKEY(me0.id)) || "null");
  if (!data) return;
  if (JSON.stringify(data).length > SB_MAX) { SB.status = "toobig"; renderAcct(); toast("This save is too big to sync (over 1 MB). It’s still saved on this device."); return; }
  const edits = SB.edits;
  SB.busy = true; if (me0 === profile) { SB.status = "saving"; renderAcct(); }
  try {
    const {data:r, error} = await SB.client.rpc("put_save", {p_data:data, p_base:me0.sbVer || 0, p_device:sbDevice()});
    if (error) throw error;
    if (r && r.ok) {
      me0.sbVer = r.version; if (SB.edits === edits) me0.sbDirty = false; saveAccounts();
      if (me0 === profile) { SB.status = "synced"; sbAfterSync(); }
    } else if (me0 === profile) {   // another device saved first: let the player choose
      const c2 = await SB.client.from("saves").select("data, version, updated_at, device").eq("user_id", me0.sb).maybeSingle();
      if (c2.data) syncConflict(c2.data); else { me0.sbVer = 0; SB.again = true; }
    }
  } catch(e){ if (me0 === profile) SB.status = isAuthErr(e) ? "signedout" : "offline"; }
  finally {
    SB.busy = false; if (me0 === profile) renderAcct();
    if (SB.again) { SB.again = false; if (profile && profile.sb && profile.sbDirty) sbQueue(); }
  }
}
function syncConflict(cloud){
  SB.status = "conflict"; renderAcct();
  const here = saveSummary(persisted()), there = saveSummary(cloud.data), me0 = profile;
  const md = openModal(`<h3 class="mt" id="modalTitle">Which progress should we keep?</h3>
    <p>This device and your online account both changed since they last synced.</p>
    <div class="sync-pick">
      <button class="sync-opt" type="button" data-keep="here"><b>Keep this device’s progress</b><span>${sumHTML(here)}</span></button>

}

const undoStack = [];
const redoStack = [];
const snapData = () => JSON.stringify({teams:state.teams, teamShiny:state.teamShiny, members:state.members, trainers:state.trainers, custom:state.custom, scenes:state.scenes, notes:state.notes, hidden:state.hidden, order:state.order});

}
function undo(){ stepHistory(undoStack, redoStack, "Undid"); }
function redo(){ stepHistory(redoStack, undoStack, "Redid"); }
function stepHistory(from, to, verb){
  const s = from.pop(); if (!s) { toast(verb === "Undid" ? "Nothing to undo." : "Nothing to redo."); renderUndo(); return; }
  to.push({label:s.label, team:state.team, data:snapData()});
  const before = JSON.stringify(state.custom);
  Object.assign(state, JSON.parse(s.data)); rebuildTeams();
  const customChanged = before !== JSON.stringify(state.custom);
  const switched = s.team !== state.team && TEAM_BY.has(s.team);
  if (!TEAM_BY.has(state.team)) fixCurrent();
  if (switched) { state.hidden = state.hidden.filter(x => x !== s.team); state.team = s.team; }
  save();
  if (!$("app").hidden) { if (switched || customChanged) renderAll(); else { renderTabs(); renderTeam(); syncSelection(); if (state.f.free) renderGrid(); } }
  else if (!$("start").hidden) startStage.load();
  renderUndo(); toast(`${verb}: ${s.label}`);
}
function renderUndo(){
  const b = $("undoBtn"); if (!b) return;
  b.disabled = !undoStack.length;
  b.title = undoStack.length ? `Undo: ${undoStack[undoStack.length - 1].label} (Ctrl+Z · redo with Ctrl+Shift+Z)` : "Nothing to undo";
}

$("toast").addEventListener("click", e => { if (e.target.closest("[data-tundo]")) { $("toast").hidden = true; undo(); } });
document.addEventListener("keydown", e => {

// ================= SHARE CODES =================
function shareCode(id){
  const t = teamOf(id); if (!t.length) return "";
  const sh = state.teamShiny[id] || [];
  return `DTD-${id}-` + t.map(n => n.toString(36) + (sh.includes(n) ? "!" : "") + (ballOf(id, n) !== "poke" ? "~" + BALL_IDS.indexOf(ballOf(id, n)).toString(36) : "")).join(".") + "@" + trainerOf(id).toString(36);
}
function parseCode(s){
  const m = String(s || "").trim().replace(/\s+/g, "").match(/^DTD-([a-z0-9]+)-([0-9a-z!~.]+?)(?:@([0-9a-z]+))?$/i); if (!m) return null;
  let id = m[1].toLowerCase(), T = TEAM_BY.get(id), fresh = false;
  if (!T && /^c[0-9a-z]+$/.test(id)) { T = TEAM_BY.get("all"); fresh = true; }
  if (!T) return null;
  const mons = [], shiny = [], balls = {};
  for (const part of m[2].toLowerCase().split(".")) {
    const p = part.match(/^([0-9a-z]+)(!)?(?:~([0-9a-z]))?$/); if (!p) return null;
    const n = parseInt(p[1], 36); if (!T.byNum.has(n) || mons.includes(n)) return null;
    mons.push(n); if (p[2]) shiny.push(n);
    if (p[3]) { const b = BALL_IDS[parseInt(p[3], 36)]; if (b) balls[n] = b; }
  }
  if (!mons.length || mons.length > (fresh ? MAXSIZE : T.size || MAX)) return null;
  const tr = m[3] ? parseInt(m[3], 36) : NaN;
  return {id: fresh ? null : id, mons, shiny, balls, tr: Number.isInteger(tr) && tr >= 0 && tr < TRAINERS.length ? tr : null};
}
function applyCode(c){
  if (!c.id) { const nc = addCustom({...ctDraft0(), name:"Shared team", size:Math.max(MAX, c.mons.length)}); if (!nc) return; c.id = nc.id; }
  const T = TEAM_BY.get(c.id);
  snap(`Loaded a ${T.card} code`);
  state.teams[c.id] = c.mons; state.teamShiny[c.id] = c.shiny;
  state.members[c.id] = Object.fromEntries(Object.entries(c.balls).map(([n, b]) => [n, {ball:b}]));
  if (c.tr !== null) state.trainers[c.id] = c.tr;
  state.hidden = state.hidden.filter(x => x !== c.id); state.team = c.id;
  touched(); save(); renderAll(); toast(`Loaded a ${T.card} team from a code.`, {undo:true});
}

        && (!S.cov || (isDmg(mv) && TYPE_ORDER.some(d => effOf(mv[1], [d]) >= 2 && !curDm.some(x => effOf(x[1], [d]) >= 2)))));
      const k = key[S.sort] || key.rec, ks = new Map(rows.map(mv => [mv[0], k(mv)]));
      rows.sort((a, b) => { const x = ks.get(a[0]), y = ks.get(b[0]); return (x < y ? -1 : x > y ? 1 : a[0].localeCompare(b[0]))*(S.sort === "rec" ? -1 : S.dir); });

        + rows.map(mv => { const c = how.get(mv[0]), kn = known.has(mv[0]) && have[slot] && have[slot][0] !== mv[0], cur = have[slot] && have[slot][0] === mv[0];
          return `<div class="mp-row${sel === mv[0] ? " sel" : ""}${!moveWorks(mv) ? " off" : ""}" role="option" aria-selected="${sel === mv[0]}" data-mv="${esc(mv[0])}" id="mpo-${MOVE_IDX.get(mv[0])}">

            <span class="mp-n">${mv[3] || "—"}</span><span class="mp-n">${mv[4] || "—"}</span><span class="mp-n">${maxPP(mv)}</span></div>`; }).join("")

      const fx = mv[8] || {}, sec = (fx.sec || []).find(x => x.st || x.v || x.b), c = how.get(mv[0]), cur = have[slot] && have[slot][0] === mv[0], other = have.findIndex((x, k) => k !== slot && x[0] === mv[0]);
      det.innerHTML = `<div class="mpd-h" style="${tStyle(mv[1])}"><b>${esc(mv[0])}</b><span>${catIcon(mv)}${mv[1]} · ${catName(mv)}</span></div>

        <p class="mpd-d">${esc(moveDesc(mv, true) || moveDesc(mv))}</p>${moveWorks(mv) ? "" : `<p class="note">This move has no effect in these battles.</p>`}
        <button class="btn primary mpd-go" type="button" id="mpTeach" ${cur ? "disabled" : ""}>${cur ? "Already in this slot" : other >= 0 ? `Move it to slot ${slot + 1}` : `Teach ${esc(mv[0])}`}</button>`;
    };
    const teach = name => {
      const mvs = movesOf(id, num).map(x => x[0]), o = mvs.indexOf(name);
      if (o >= 0) { if (o === slot) return; mvs.splice(o, 1); }

const ITEM_TABS = [["pop", "Popular"], ["battle", "Works in battle"], ["berry", "Berries"], ["type", "Type boosters"], ["plate", "Plates, Memories & Gems"], ["z", "Z-Crystals"], ["other", "No battle effect"], ["all", "Everything"]];
let ipTab = "pop";
function openItemPicker(num, id = state.team){
  const cur = memberOf(id, num).item || "", pool = ITEMS.filter(it => it[2] !== "ball");
  let sel = cur, q = "";
  const md = openModal(`<div class="ip"><div class="pk-head"><button class="btn sm" type="button" id="ipBack">← Back</button><h3 class="mt" id="modalTitle">Held item for ${esc(nickOf(id, num))}</h3></div>

    <div class="ip-body"><div class="ip-grid" id="ipGrid"></div><aside class="ip-detail" id="ipDet" aria-live="polite"></aside></div></div>`, {wide:true, sheet:true});
  const inTab = it => { const [nm, , cat] = it;
    switch (ipTab) {
      case "pop": return POPULAR_ITEMS.includes(nm);
      case "battle": return itemWorks(nm) && cat === "held";
      case "berry": return cat === "berry";
      case "type": return cat === "type";
      case "plate": return cat === "plate" || cat === "memory" || cat === "drive" || cat === "gem";
      case "z": return cat === "z";
      case "other": return !itemWorks(nm);
      default: return true;
    } };
  const draw = () => {
    const qq = q.trim().toLowerCase();
    let list = pool.filter(it => qq ? it[0].toLowerCase().includes(qq) : inTab(it));
    if (ipTab === "pop" && !qq) list.sort((a, b) => POPULAR_ITEMS.indexOf(a[0]) - POPULAR_ITEMS.indexOf(b[0]));
    md.querySelector("#ipGrid").innerHTML = list.map(it => `<button class="ip-it${it[0] === sel ? " sel" : ""}${it[0] === cur ? " cur" : ""}${itemWorks(it[0]) ? "" : " off"}" type="button" data-it="${esc(it[0])}" aria-pressed="${it[0] === sel}" title="${esc(it[0])}">${itemIcon(it[0])}<span>${esc(it[0])}</span></button>`).join("") || `<p class="meta">No item matches “${esc(q)}”.</p>`;
    detail();
  };
  const detail = () => {
    const d = md.querySelector("#ipDet");
    if (!sel) { d.innerHTML = `<p class="meta">${cur ? "" : "No item held. "}Pick an item to see what it does.</p>${cur ? `<button class="btn" type="button" id="ipRemove">Remove ${esc(cur)}</button>` : ""}`; return; }
    const works = itemWorks(sel);
    d.innerHTML = `<div class="ipd-h">${itemIcon(sel, true)}<div><b>${esc(sel)}</b><span class="badge ${works ? "ok" : "no"}">${works ? "Works in battle" : "No battle effect here"}</span></div></div>
      <p class="mpd-d">${esc(itemDesc(sel))}</p>
      <div class="actions"><button class="btn primary" type="button" id="ipGive" ${sel === cur ? "disabled" : ""}>${sel === cur ? "Holding it now" : `Give ${esc(sel)}`}</button>${cur ? `<button class="btn" type="button" id="ipRemove">Remove item</button>` : ""}</div>`;
  };
  const done = (it, msg) => { setMember(id, num, {item:it}); renderTeam(); Sound.play("confirm"); toast(msg); sheetBack(num, id); };
  md.querySelector("#ipBack").onclick = () => sheetBack(num, id);
  md.querySelector("#ipQ").addEventListener("input", e => { q = e.target.value; draw(); });
  md.querySelector("#ipTabs").onclick = e => { const b = e.target.closest("[data-ipt]"); if (!b) return; ipTab = b.dataset.ipt; md.querySelectorAll("[data-ipt]").forEach(x => { x.setAttribute("aria-pressed", x === b); x.setAttribute("aria-selected", x === b); }); Sound.play("select"); draw(); };
  md.querySelector("#ipGrid").addEventListener("click", e => { const b = e.target.closest("[data-it]"); if (!b) return; sel = b.dataset.it; md.querySelectorAll(".ip-it.sel").forEach(x => { x.classList.remove("sel"); x.setAttribute("aria-pressed", "false"); }); b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); detail(); });
  md.querySelector("#ipGrid").addEventListener("dblclick", e => { const b = e.target.closest("[data-it]"); if (b && b.dataset.it !== cur) done(b.dataset.it, `${nickOf(id, num)} is now holding ${b.dataset.it}.`); });
  md.querySelector("#ipDet").addEventListener("click", e => {
    if (e.target.closest("#ipGive") && sel) done(sel, `${nickOf(id, num)} is now holding ${sel}.`);
    if (e.target.closest("#ipRemove")) done("", `${nickOf(id, num)} isn’t holding an item now.`);
  });
  if (cur && !pool.some(it => it[0] === cur && inTab(it))) ipTab = "all";
  md.querySelectorAll("[data-ipt]").forEach(x => { x.setAttribute("aria-pressed", x.dataset.ipt === ipTab); x.setAttribute("aria-selected", x.dataset.ipt === ipTab); });
  draw();
  const s = md.querySelector(".ip-it.sel"); if (s) s.scrollIntoView({block:"nearest"});
}

function ecoMigrate(){

    let pts = 500 + 100*Object.keys(G.ach).filter(id => ACH.some(a => a.id === id)).length + 150*Object.keys(G.wins).length;
    for (const L of LEAGUES) { for (let k = 0; k < 8; k++) if (hasBadge(L.g, k)) pts += 200; if (G.leagues[L.g]) pts += 1000; }
    for (const o of Object.values(state.members)) for (const M of Object.values(o || {})) if (M && M.ball && !owns("ball", M.ball)) grant(unlockOf("ball", M.ball));
    for (const s of Object.values(state.scenes)) if (s && s.bg && unlockOf("bg", s.bg) && !owns("bg", s.bg)) grant(unlockOf("bg", s.bg));
    if (G.card && unlockOf("card", G.card) && !owns("card", G.card)) grant(unlockOf("card", G.card));
    G.pp += pts; G.ppTotal += pts; G.eco = 1; G.ecoNew = pts;
  }
  // v2: the new reward table. Players keep everything they own and get the new rewards for leaders they already beat.
  if (G.eco < 2) {
    let n = 0;
    for (const L of LEAGUES) {
      for (let k = 0; k < 8; k++) if (hasBadge(L.g, k)) n += gymRewards(L.g, k).length;
      if (G.leagues[L.g]) { G.e4[L.g] = 15; for (let k = 0; k < 4; k++) n += e4Rewards(L.g, k).length; n += champRewards(L.g).length; }

  }
}

  ({battle:renderBattleScreen, quiz:renderQuiz, home:renderHome, shop:renderShop, hofgal:renderHofGallery, card:renderCard, ach:renderAch, settings:renderSettings, friends:renderFriends})[k]();

async function screenBack(){
  if (!$("modalWrap").hidden) return;
  if (nav.screen === "battle" && nav.sub === "fight" && F.b && !F.b.over) {
    const ok = await askConfirm("Leave this battle?", F.cfg.leaveNote || "Leaving now counts as a loss.", "Leave battle"); if (!ok) return;
    if (F.cfg.onLeave) F.cfg.onLeave();
  }
  Sound.play("back");
  if (nav.screen === "battle" && nav.sub === "fight" && F.cfg && F.cfg.backFn) { F.cfg.backFn(); return; }
  if (nav.screen === "battle" && nav.sub && nav.sub !== "menu") { const to = nav.sub === "fight" ? (F.cfg && F.cfg.back) || "menu" : "menu"; openScreen("battle", to); return; }
  showHub();
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("screen").hidden && $("modalWrap").hidden) { e.preventDefault(); screenBack(); } });
function askConfirm(title, text, yes){
  return new Promise(res => {
    let done = false; const fin = v => { if (done) return; done = true; res(v); };
    const md = openModal(`<h3 class="mt" id="modalTitle">${esc(title)}</h3><p>${esc(text)}</p><div class="actions"><button class="btn primary" type="button" id="cfYes">${esc(yes)}</button><button class="btn" type="button" id="cfNo">Stay</button></div>`, {onClose:() => fin(false)});
    md.querySelector("#cfYes").onclick = () => { fin(true); closeModal(); };
    md.querySelector("#cfNo").onclick = () => closeModal();
  });
}

let achReady = false;
function checkAch(silent){
  if (!profile || typeof ACH === "undefined" || VISIT) return;
  const now = Date.now(), fresh = [];
  for (const a of ACH) { if (state.games.ach[a.id]) continue; const [c, m] = a.p(); if (c >= m) { state.games.ach[a.id] = now; fresh.push(a); } }
  if (!fresh.length) return;
  const pts = 100*fresh.length; state.games.pp += pts; state.games.ppTotal += pts;   // every achievement is worth 100 PokéPoints
  if (silent || !achReady) return;
  setTimeout(() => { Sound.play("up"); toast(`🏆 Achievement unlocked: ${fresh.map(a => a.name).join(", ")}`); ppChip(`+${pts}`, fresh.length > 1 ? "Achievements" : fresh[0].name); }, 350);
  if (nav.screen === "ach") renderAch();
}

    const a = pickOne(P);

        const rows = BAG_ORDER.filter(k => S.bag[k] > 0).map(k => { const can = S.party.some((m, x) => bagCanUse(k, m, x === S.act)); return `<button class="bt-bagb" type="button" data-bagit="${esc(k)}" ${can ? "" : "disabled"}>${itemIcon(k)}<b>${esc(k)}</b><span class="bag-n">×${S.bag[k]}</span><small>${esc(BAG_ITEMS[k].d)}${can ? "" : " Nobody needs it right now."}</small></button>`; }).join("");
        c.innerHTML = `<p class="bt-q">${F.cfg.hotseat ? `<b>${esc(S.name)}:</b> ` : ""}Use which item? <span class="meta">Using an item takes your turn.</span></p><div class="bt-sw bt-bag">${rows || `<p class="note">The bag is empty.</p>`}</div><div class="bt-acts"><button class="btn sm" type="button" data-bt="cancel">Back</button></div>`;
      } else {
        c.innerHTML = `<p class="bt-q">Use the <b>${esc(item)}</b> on which Pokémon?</p><div class="bt-sw">${S.party.map((m, k) => { const ok = bagCanUse(item, m, k === S.act);
          return `<button class="bt-swb${ok ? " good" : ""}" type="button" data-bagto="${k}" ${ok ? "" : "disabled"}><span class="sw-id"><span class="sw-top">${ballImg(m.ball)}<b class="sw-n">${esc(m.name)}</b>${m.status && m.hp > 0 ? `<span class="bt-st" data-st="${m.status}">${ST_TAG[m.status]}</span>` : ""}<span class="sw-hp">${m.hp <= 0 ? "Fainted" : `${m.hp}/${m.max}`}</span></span>${m.hp > 0 ? `<span class="bt-bar sm"><i style="width:${m.hp/m.max*100}%" data-l="${m.hp/m.max <= .2 ? "r" : m.hp/m.max <= .5 ? "y" : "g"}"></i></span>` : ""}</span></button>`; }).join("")}</div><div class="bt-acts"><button class="btn sm" type="button" data-bagback>Back</button></div>`;
      }
      toSide(c);
    };
    F.bagPick = v => {
      if (v === "back") { item = null; draw(); return; }
      if (typeof v === "string") { const it = BAG_ITEMS[v]; if (it.boost || it.crit || it.mist) { resolveAsk({item:v, target:S.act}); return; } const ok = S.party.map((m, k) => bagCanUse(v, m, k === S.act) ? k : -1).filter(k => k >= 0); item = v; if (ok.length === 1 && it.revive === undefined && ok[0] === S.act) { resolveAsk({item:v, target:S.act}); return; } draw(); return; }
      resolveAsk({item, target:v});
    };

  });
}
// one switch choice, one row: who (name, HP, types) on the left, their moves rated against the foe on the right
function swButton(B, i, m, k, active){
  const foe = B.get(1 - i), vs = !!foe && foe.hp > 0, out = m.hp <= 0;
  const top = `<span class="sw-top">${ballImg(m.ball)}<b class="sw-n" title="${esc(m.name)}">${esc(m.name)}</b>${m.status && !out ? `<span class="bt-st" data-st="${m.status}">${ST_TAG[m.status]}</span>` : ""}<span class="sw-hp">${out ? "Fainted" : `${m.hp}/${m.max}`}</span></span>`;
  if (out) return `<button class="bt-swb out" type="button" data-sw="${k}" disabled>${top}</button>`;
  let best = -1;
  const mv = m.moves.map(mv => { const dmg = isDmg(mv), t = mv[1] === "???" ? "Normal" : B.moveType(m, mv);
    const e = vs && dmg ? B.typeMul(m, foe, mv, t) : null;
    if (e !== null) best = Math.max(best, e);
    const c = e === null ? "s" : e === 0 ? "0" : e >= 4 ? "4" : e >= 2 ? "2" : e < 1 ? "h" : "1";
    const word = {s: dmg ? "fixed damage" : "status move", 0:"no effect", 4:"super effective (×4)", 2:"super effective", h:"not very effective", 1:"normal damage"}[c];
    return `<span class="sw-m${c === "h" || c === "0" ? " dim" : ""}" style="${tStyle(t)}" title="${esc(mv[0])} · ${t} · ${word}${vs && e !== null ? ` on ${esc(foe.name)}` : ""}"><span>${esc(mv[0])}</span><i data-e="${c}">${{0:"✕", 4:"×4", 2:"×2", h:"½", 1:"", s:""}[c]}</i></span>`; }).join("");
  const weak = vs && foe.types.some(t => effOf(t, m.types) >= 2);
  return `<button class="bt-swb${active ? " cur" : best >= 2 ? " good" : ""}" type="button" data-sw="${k}" ${active ? "disabled" : ""}>
    <span class="sw-id">${top}<span class="bt-bar sm"><i style="width:${m.hp/m.max*100}%" data-l="${m.hp/m.max <= .2 ? "r" : m.hp/m.max <= .5 ? "y" : "g"}"></i></span>
      <span class="sw-tags">${m.types.map(t => `<span class="tb" style="${tStyle(t)}">${t}</span>`).join("")}${m.item ? `<span class="sw-flag item" title="Held item: ${esc(m.item)}">${itemIcon(m.item)}${esc(m.item)}</span>` : ""}${active ? `<span class="sw-flag cur">In battle</span>` : weak ? `<span class="sw-flag warn">Weak to foe</span>` : ""}</span></span>
    <span class="sw-mv">${mv}</span></button>`;
}
function askSwitch(i, forced, mid){

    c.innerHTML = `<p class="bt-q">${F.cfg.hotseat ? `<b>${esc(S.name)}:</b> ` : ""}${mid ? "Who comes in?" : forced ? "Choose your next Pokémon." : "Switch to which Pokémon?"}</p>
      <div class="bt-sw">${(() => { const foe = B.get(1 - i); return foe && foe.hp > 0 ? `<p class="sw-key">Moves rated against <b>${esc(foe.name)}</b>: ×2 super effective · ½ not very effective · ✕ no effect. Green edge = has a super-effective move.</p>` : ""; })()}${S.party.map((m, k) => swButton(B, i, m, k, k === S.act)).join("")}</div>

}
document.addEventListener("keydown", e => {
  if (nav.screen !== "battle" || nav.sub !== "fight" || !$("modalWrap").hidden || e.target.closest("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;

// long-press a move card (touch screens) to read power, accuracy and what it does
let lpTimer = 0, lpShown = false;
document.addEventListener("pointerdown", e => {

["pointerup", "pointercancel", "pointerleave"].forEach(k => document.addEventListener(k, () => { clearTimeout(lpTimer); if (lpShown) setTimeout(() => { $("tip").hidden = true; }, 1600); }, true));

function onFightClick(e){
  const b = e.target.closest("[data-mv], [data-sw], [data-bt], [data-res], [data-bagit], [data-bagto], [data-bagback]"); if (!b) return;
  if (b.dataset.bagit !== undefined) { Sound.play("select"); if (F.bagPick) F.bagPick(b.dataset.bagit); return; }
  if (b.dataset.bagto !== undefined) { Sound.play("select"); if (F.bagPick) F.bagPick(+b.dataset.bagto); return; }
  if (b.hasAttribute("data-bagback")) { if (F.bagPick) F.bagPick("back"); return; }
  if (b.dataset.res !== undefined) { const fn = F.result && F.result[+b.dataset.res]; if (fn) { Sound.play("select"); fn(); } return; }
  if (b.dataset.mv !== undefined) { Sound.play("select"); resolveAsk({move:+b.dataset.mv}); return; }
  if (b.dataset.sw !== undefined) { Sound.play("select"); resolveAsk(+b.dataset.sw); return; }
  const a = b.dataset.bt;
  if (a === "switch") resolveAsk({sw:"menu"});
  else if (a === "bag") resolveAsk({bag:"menu"});
  else if (a === "cancel") resolveAsk(null);
  else if (a === "ready") resolveAsk(true);
  else if (a === "auto") { F.auto = true; resolveAsk({auto:true}); }
  else if (a === "autosw") { F.auto = true; resolveAsk(null); }
  else if (a === "autotog") { F.auto = !F.auto; renderWait(); }
  else if (a === "fast") { F.fast = true; F.auto = true; b.disabled = true; b.textContent = "⏭ Skipping to the result…"; clearTimeout(F.timer); if (F.wake) F.wake(); if (F.resolve) resolveAsk(document.querySelector("#btSide .bt-moves, #btCmd .bt-moves") ? {auto:true} : null); else renderWait(); }   // the choices may sit in the side panel
  else if (a === "run") askConfirm("Forfeit this battle?", "It counts as a loss.", "Forfeit").then(ok => { if (ok) resolveAsk({forfeit:true}); });
}
function finishBattle(){
  const B = F.b; B.cleanup(); const win = B.winner === 0, res = F.cfg.onEnd ? F.cfg.onEnd(win, B) : {text: win ? "You won!" : "You lost.", buttons:[]};

  toSide(c);
  checkAch();
}

// ---------- full screen (covers the taskbar, browser and Claude UI) ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function renderFs(){
  const on = !!fsEl();
  document.querySelectorAll("[data-fs]").forEach(b => { b.setAttribute("aria-pressed", on); b.setAttribute("aria-label", on ? "Exit full screen" : "Full screen"); b.title = on ? "Exit full screen (Esc)" : "Full screen"; });
  document.documentElement.classList.toggle("is-fs", on);
}
async function toggleFs(){
  try {
    if (fsEl()) { await (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) throw new Error("unsupported");
    await req.call(el, {navigationUI:"hide"});
  } catch(e){
    toast("Full screen isn’t allowed here. Open the page in its own browser tab and press F11, or use the browser’s full-screen option.");
  }
}
document.addEventListener("click", e => { if (e.target.closest("[data-fs]")) toggleFs(); });
document.addEventListener("fullscreenchange", renderFs); document.addEventListener("webkitfullscreenchange", renderFs);
document.addEventListener("keydown", e => { if ((e.key === "f" || e.key === "F") && !e.target.closest("input, textarea, select") && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFs(); });

let errNoteAt = 0;
function noteError(e){
  const msg = String((e && (e.message || e.reason && e.reason.message || e.reason)) || "");
  if (/ResizeObserver|Script error|AbortError|NotAllowedError/.test(msg)) return;
  console.error(e && (e.error || e.reason) || e);

  try { toast("Something went wrong there. If it keeps happening, reload the page — your progress is saved."); } catch(_){}
}
addEventListener("error", e => { if (e.target === window || !e.target || !e.target.tagName) noteError(e); });
addEventListener("unhandledrejection", noteError);
