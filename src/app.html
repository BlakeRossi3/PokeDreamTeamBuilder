<meta charset="utf-8">
<title>Dream Team Dex</title>
<meta name="description" content="Build Pokémon dream teams for every region, stage Hall of Fame scenes, battle Gym Leaders and play quizzes, in 2D pixel art or 3D.">
<meta name="theme-color" content="#0e1729">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Rubik:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Dream Team Dex
   Screens: sign-in → title scene → main menu (hub) → Team Builder (#app) or a game screen (#screen: battle, quiz,
   Pokémon Home, Shop, Hall of Fame gallery, trainer card, achievements, settings). Overlays: Hall of Fame scene, View team, modals.
   Two looks share one markup: 3D = modern-console menus (slanted plates, yellow cursor, medallion portraits);
   2D = handheld party menus (pixel borders, ▶ cursor). Each look has its own themes (data-t3 / data-t2) and accent.
   Sprites live in binary packs (s/*.wasm, t/*.wasm) indexed by IDX and decoded on demand. */
:root{
  --bg:#0e1729; --bg-2:#13203a; --stripe:rgba(255,255,255,.028); --accent-d:#b8401f;
  --panel:#16223c; --panel-solid:#16223c; --panel-2:#1c2b4b; --raised:#1d2c4c; --raised-2:#25375d;
  --line:#2f4370; --line-2:#3e5791; --fg:#f2f5ff; --muted:#9fb0d6;
  --accent:#ff6a3d; --accent-b:#ff9b4a; --accent-2:#8f6bff; --on-accent:#ffffff;
  --hi:#ffd43b; --on-hi:#1b1400;
  --good:#46d996; --warn:#ffc24a; --bad:#ff5d6c; --fav:#ff5d8f;
  --platform:radial-gradient(closest-side, rgba(143,107,255,.5), rgba(143,107,255,.14) 60%, transparent);
  --medal-bg:radial-gradient(circle at 50% 35%, #3a2f74, #161c3a 70%); --medal-r:50%; --medal-ring:0 0 0 3px #ffffff, 0 0 0 6px #8f6bff;
  --slot-bg:#1d2c4c; --hover-bg:#25375d; --sel-bg:#2a2a3a;
  --plate:#0b1222; --plate-fg:#ffffff;
  --font-d:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --font-b:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs:15px; --fs-sm:13px; --fs-xs:11.5px; --fs-h1:26px; --fs-h2:17px;
  --r:18px; --r-sm:12px; --pill:999px; --bw:2px;
  --shadow:0 12px 32px rgba(0,0,0,.4);
  --inset:inset 0 1px 0 rgba(255,255,255,.07);
  --slant:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
  --pixel:auto;
  color-scheme:dark;
}
:root[data-mode="2d"]{
  --bg:#cddfd6; --bg-2:#cddfd6; --stripe:transparent;
  --panel:#f8f8ec; --panel-solid:#f8f8ec; --panel-2:#f8f8ec; --raised:#e6efe9; --raised-2:#d6e6dd;
  --line:#28323f; --line-2:#a7bcb2; --fg:#1d2631; --muted:#4f5d6b;
  --accent:#d63a3a; --accent-b:#d63a3a; --accent-2:#3a68b8; --on-accent:#ffffff;
  --hi:#ffe9a8; --on-hi:#1d2631;
  --good:#2b9348; --warn:#c98a00; --bad:#d63a3a; --fav:#d63a6a;
  --platform:none;
  --medal-bg:transparent; --medal-r:0; --medal-ring:none;
  --slot-bg:#dcecf5; --hover-bg:#fff6cf; --sel-bg:#ffe9a8;
  --plate:transparent; --plate-fg:#1d2631;
  --font-d:"Pixelify Sans", "Courier New", monospace;
  --font-b:"VT323", "Courier New", monospace;
  --fs:20px; --fs-sm:18px; --fs-xs:16px; --fs-h1:28px; --fs-h2:20px;
  --r:4px; --r-sm:2px; --pill:2px; --bw:3px;
  --ink:#28323f; --paper:#f8f8ec; --hl:#ffffff; --frame:#a9cbe2; --dots:#c4d8ce; --accent-d:#9c2525;
  --shadow:4px 4px 0 var(--ink);
  --inset:inset 0 0 0 3px var(--frame);
  --slant:none;
  --pixel:pixelated;
  color-scheme:light;
}
[hidden]{display:none!important}
body{margin:0}
.top, .tabs-wrap{flex:none}
/* scrollbars: violet-to-orange pills on navy (3D), chunky pixel bars (2D) */
:root{--sb-track:#0b1222; --sb-thumb:#6b5bd6; --sb-v:linear-gradient(#8f6bff, #ff6a3d); --sb-h:linear-gradient(90deg, #8f6bff, #ff6a3d); --sb-r:999px; --sb-pad:3px solid #0b1222}
:root[data-mode="2d"]{--sb-track:var(--raised); --sb-thumb:var(--ink); --sb-v:var(--ink); --sb-h:var(--ink); --sb-r:0; --sb-pad:3px solid var(--raised)}
@supports not selector(::-webkit-scrollbar){ *{scrollbar-width:thin; scrollbar-color:var(--sb-thumb) var(--sb-track)} }
::-webkit-scrollbar{width:12px; height:12px}
::-webkit-scrollbar-track{background:var(--sb-track)}
::-webkit-scrollbar-thumb{background:var(--sb-v); border-radius:var(--sb-r); border:var(--sb-pad); min-height:40px}
::-webkit-scrollbar-thumb:horizontal{background:var(--sb-h)}
::-webkit-scrollbar-thumb:hover{border-width:2px}
::-webkit-scrollbar-corner{background:transparent}
.tabs-wrap::-webkit-scrollbar-track, .team-panel::-webkit-scrollbar-track, .modal::-webkit-scrollbar-track{background:transparent; margin:6px}
:root[data-mode="2d"] .tabs-wrap::-webkit-scrollbar-track{background:var(--raised); box-shadow:inset 0 0 0 2px var(--ink)}
:root[data-mode="2d"] ::-webkit-scrollbar-thumb{box-shadow:inset 2px 2px 0 var(--muted)}
html,body{min-height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--font-b); font-size:var(--fs); line-height:1.4;
  background-image:repeating-linear-gradient(135deg, var(--stripe) 0 14px, transparent 14px 28px), radial-gradient(70% 55% at 0% 0%, rgba(143,107,255,.18), transparent 70%), radial-gradient(60% 45% at 100% 0%, rgba(255,106,61,.12), transparent 70%);
  background-attachment:fixed}
:root[data-mode="2d"] body{background-image:radial-gradient(var(--dots) 1.6px, transparent 1.7px); background-size:12px 12px}
:root[data-view="start"] body{background:#0e1729}
h1,h2,h3{font-family:var(--font-d); margin:0; text-wrap:balance; letter-spacing:.01em}
button,input,select{font:inherit; color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--hi); outline-offset:2px}

/* ================= START SCREEN: your all-gen Hall of Fame scene ================= */
html[data-view="start"], html[data-view="start"] body{height:100%; overflow:hidden}
html[data-view="hub"], html[data-view="hub"] body{height:100%}
html[data-view="hub"] .start{height:auto; min-height:100%}
html[data-view="hub"] .start-ui{min-height:100vh; min-height:100dvh}
.start{position:relative; height:100%; min-height:420px; overflow:hidden; background:#05070f; color:#fff}
.start-canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
.start-shade{position:absolute; inset:0; pointer-events:none; background:linear-gradient(rgba(5,7,15,.55), rgba(5,7,15,0) 28%, rgba(5,7,15,0) 62%, rgba(5,7,15,.8))}
.start-ui{position:relative; z-index:2; height:100%; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between; padding-block:clamp(16px,4vh,40px) 16px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); pointer-events:none}
.start-ui > *{pointer-events:auto}
.logo{position:relative; display:flex; align-items:center; justify-content:center; gap:clamp(8px,1.6vw,20px); flex-wrap:nowrap; padding-bottom:18px; align-self:center}
.lw{font-size:clamp(30px, 7vw, 92px); line-height:.95; letter-spacing:.02em}
.lw.l2{font-family:"Pixelify Sans", "Courier New", monospace; font-weight:700; color:#d63a3a; text-shadow:4px 4px 0 #28323f, -2px -2px 0 #f8f8ec}
.lw.l3{font-family:"Chakra Petch", system-ui, sans-serif; font-weight:700; font-style:italic; color:#fff; text-shadow:3px 3px 0 #ff6a3d, 6px 6px 0 #8f6bff}
.emblem{position:relative; width:clamp(44px,6.5vw,84px); aspect-ratio:1; flex:none; display:block}
.emblem i{position:absolute; inset:0; display:block}
.emblem .e2{background:linear-gradient(#d63a3a 0 45%, #28323f 45% 55%, #f8f8ec 55%); clip-path:polygon(30% 0,50% 0,50% 100%,30% 100%,0 70%,0 30%)}
.emblem .e3{border-radius:50%; background:linear-gradient(#ff6a3d, #ff4d2e 45%, #0e1729 45% 55%, #f2f5ff 55%); clip-path:inset(0 0 0 50%); box-shadow:inset -6px -8px 14px rgba(0,0,0,.25)}
.emblem::after{content:""; position:absolute; left:50%; top:50%; width:30%; height:30%; transform:translate(-50%,-50%); background:#f8f8ec; border-radius:50%; box-shadow:0 0 0 5px #28323f}
.dex-tag{position:absolute; left:50%; bottom:-4px; transform:translateX(-50%); padding:4px 16px; background:#ffd43b; color:#1b1400; font-family:"Chakra Petch", system-ui, sans-serif; font-weight:700; font-style:italic; letter-spacing:.45em; font-size:13px; clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%); white-space:nowrap}
.start-bottom{display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center}
.start-team{margin:0; font-family:"Rubik", system-ui, sans-serif; font-size:14px; color:rgba(255,255,255,.85); text-shadow:0 1px 6px rgba(0,0,0,.8)}
.start-ctrl{display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center}
.mode-switch{display:inline-flex; padding:5px; gap:4px; background:rgba(11,18,34,.82); border:2px solid rgba(255,255,255,.18); border-radius:999px; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}
.mode-switch button{display:flex; flex-direction:column; align-items:center; min-width:92px; padding:8px 18px; border:0; border-radius:999px; background:transparent; color:#c4cde6; cursor:pointer; line-height:1.1}
.mode-switch button b{font-size:22px}
.mode-switch button span{font-size:12px; opacity:.85}
.mode-switch [data-sm="2d"] b{font-family:"Pixelify Sans", monospace}
.mode-switch [data-sm="3d"] b{font-family:"Chakra Petch", sans-serif; font-style:italic}
.mode-switch button[aria-pressed="true"]{background:#ffd43b; color:#1b1400}
:root[data-mode="2d"] .mode-switch{border-radius:0; background:var(--paper); border:3px solid var(--ink)}
:root[data-mode="2d"] .mode-switch button{border-radius:0; color:var(--muted)}
:root[data-mode="2d"] .mode-switch button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.play{display:inline-flex; align-items:center; gap:10px; padding:14px 34px; cursor:pointer; font-family:"Chakra Petch", sans-serif; font-style:italic; font-weight:700; font-size:22px; border:3px solid #fff; border-radius:999px; background:linear-gradient(100deg, #ff6a3d, #ff9b4a); color:#fff; box-shadow:0 8px 0 var(--accent-d), 0 14px 30px rgba(255,106,61,.35)}
.play:active{transform:translateY(4px); box-shadow:0 4px 0 var(--accent-d)}
.play .arr{transition:transform .2s}
.play:hover .arr{transform:translateX(4px)}
:root[data-mode="2d"] .play{font-family:"Pixelify Sans", monospace; font-style:normal; border-radius:0; border-color:var(--ink); background:var(--accent); box-shadow:4px 4px 0 var(--ink)}
:root[data-mode="2d"] .play:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink)}
.start-foot{display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; justify-content:center; font-family:"Rubik", system-ui, sans-serif; font-size:13px; color:rgba(255,255,255,.8); text-shadow:0 1px 4px rgba(0,0,0,.8)}
.start-foot .linkbtn{background:none; border:0; color:#ffd43b; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:4px; font-weight:600; font-family:inherit; font-size:inherit}

/* ================= APP ================= */
.app{max-width:1320px; margin:0 auto; padding-block:16px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); display:flex; flex-direction:column; gap:14px}
.app.switching{animation:swap .32s ease}
@keyframes swap{0%{opacity:.25; filter:blur(3px)}100%{opacity:1; filter:none}}
.top{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:12px; min-width:0; background:none; border:0; padding:0; cursor:pointer; text-align:left}
.ball{width:40px; height:40px; flex:none; border-radius:50%; position:relative; background:linear-gradient(var(--accent) 0 46%, #10131c 46% 54%, #f4f4f4 54%); box-shadow:0 0 0 2px #10131c, 0 6px 18px rgba(255,106,61,.35)}
.ball::after{content:""; position:absolute; inset:0; margin:auto; width:12px; height:12px; border-radius:50%; background:#f4f4f4; box-shadow:0 0 0 3px #10131c}
:root[data-mode="2d"] .ball{border-radius:0; clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%); box-shadow:none}
:root[data-mode="2d"] .ball::after{border-radius:0}
h1{font-size:var(--fs-h1); font-weight:700; line-height:1.05}
:root:not([data-mode="2d"]) h1{font-style:italic}
.sub{margin:2px 0 0; color:var(--muted); font-size:var(--fs-sm)}
.controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.seg{display:inline-flex; padding:4px; gap:4px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--pill); box-shadow:var(--shadow)}
.seg button{border:0; background:transparent; padding:6px 16px; border-radius:var(--pill); cursor:pointer; font-family:var(--font-d); font-weight:700; color:var(--muted); min-width:58px}
.seg button[aria-pressed="true"]{background:var(--hi); color:var(--on-hi)}
:root[data-mode="2d"] .seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.seg button .k{display:block; font-size:var(--fs-xs); font-weight:500; opacity:.8; font-family:var(--font-b)}
.toggle, .acct{display:inline-flex; align-items:center; gap:8px; padding:8px 16px; cursor:pointer; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--pill); box-shadow:var(--shadow); font-family:var(--font-d); font-weight:700; color:var(--muted); min-height:44px}
.toggle .spark{font-size:1.1em; color:var(--muted); transition:transform .3s}
.toggle[aria-pressed="true"]{color:var(--fg); border-color:var(--warn)}
.toggle[aria-pressed="true"] .spark{color:var(--warn); transform:rotate(72deg) scale(1.2)}
.acct{font-family:var(--font-b); font-weight:500; font-size:var(--fs-sm); max-width:240px}
.acct .dot{width:9px; height:9px; border-radius:50%; flex:none; background:var(--muted)}
.acct[data-s="synced"] .dot{background:var(--good); box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent)}
.acct[data-s="saving"] .dot{background:var(--warn)}
.acct[data-s="readonly"] .dot, .acct[data-s="error"] .dot{background:var(--bad)}
.acct .t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
:root[data-mode="2d"] .acct .dot{border-radius:0}

/* team tabs: slanted plates (3D) / menu boxes with ▶ cursor (2D) */
.tabs-wrap{overflow-x:auto; margin-inline:-4px; padding:4px 4px 10px}
.tabs{display:flex; gap:8px; min-width:max-content; align-items:stretch}
.tab{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:8px 22px 8px 20px; min-width:104px; cursor:pointer; text-align:left; border:0; background:var(--panel-2); clip-path:var(--slant); color:var(--fg)}
.tab .num{font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); letter-spacing:.1em; color:var(--muted); text-transform:uppercase}
.tab .reg{font-family:var(--font-d); font-weight:700; font-size:var(--fs-h2); font-style:italic; white-space:nowrap}
.tab .dots{display:flex; gap:3px; margin-top:3px}
.tab .dots i{width:8px; height:8px; border-radius:50%; background:var(--raised-2)}
.tab .dots i.on{background:var(--accent)}
.tab:hover{background:var(--raised-2)}
.tab[aria-current="true"]{background:var(--hi); color:var(--on-hi)}
.tab[aria-current="true"] .num{color:color-mix(in srgb, var(--on-hi) 70%, transparent)}
.tab[aria-current="true"] .dots i{background:rgba(0,0,0,.18)}
.tab[aria-current="true"] .dots i.on{background:var(--accent)}
.tab.theme .num{color:var(--accent-b)}
:root[data-mode="2d"] .tab{clip-path:none; border:var(--bw) solid var(--line); background:var(--panel); box-shadow:var(--inset); padding:8px 12px 8px 22px}
:root[data-mode="2d"] .tab .reg{font-style:normal}
:root[data-mode="2d"] .tab .dots i{border-radius:0; border:1px solid var(--line); background:var(--raised-2)}
:root[data-mode="2d"] .tab .dots i.on{background:var(--accent)}
:root[data-mode="2d"] .tab:hover::before, :root[data-mode="2d"] .tab[aria-current="true"]::before{content:"▶"; position:absolute; left:6px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--fg)}
:root[data-mode="2d"] .tab[aria-current="true"]{background:var(--sel-bg); box-shadow:var(--shadow)}
:root[data-mode="2d"] .tab.theme .num{color:var(--accent)}
.tab-edit{display:flex; align-items:center; gap:6px; padding:8px 16px; cursor:pointer; border:var(--bw) dashed var(--line-2); background:transparent; border-radius:var(--r-sm); color:var(--muted); font-family:var(--font-d); font-weight:700; white-space:nowrap}

.layout{display:grid; gap:14px; grid-template-columns:minmax(0,440px) minmax(0,1fr); align-items:start}
.layout.closed{grid-template-columns:minmax(0,1fr)}
.layout.closed .team-panel{display:none}
@media (max-width:920px){ .layout{grid-template-columns:minmax(0,1fr)} }

.panel{background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r); box-shadow:var(--shadow), var(--inset); padding:16px; min-width:0}
:root[data-mode="2d"] .panel{box-shadow:var(--inset), var(--shadow)}
.ph{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.ph h2{font-size:var(--fs-h2); display:inline-block}
:root:not([data-mode="2d"]) .ph h2{font-style:italic; background:linear-gradient(100deg, var(--accent), var(--accent-b)); color:var(--on-accent); padding:5px 22px 5px 18px; clip-path:var(--slant); margin-left:-4px}
.ph .right{display:flex; align-items:center; gap:8px}
.meta{color:var(--muted); font-size:var(--fs-sm); font-variant-numeric:tabular-nums}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:9px 16px; cursor:pointer; font-family:var(--font-d); font-weight:700;
  background:var(--raised); border:var(--bw) solid var(--line-2); border-radius:var(--pill); color:var(--fg)}
.btn:hover{background:var(--raised-2)}
.btn.primary{background:linear-gradient(100deg, var(--accent), var(--accent-b)); color:var(--on-accent); border-color:#fff; box-shadow:0 4px 0 var(--accent-d)}
.btn.primary:active{transform:translateY(3px); box-shadow:0 1px 0 var(--accent-d)}
:root[data-mode="2d"] .btn{border-radius:var(--r-sm); border-color:var(--line)}
:root[data-mode="2d"] .btn.primary{background:var(--accent); border-color:var(--line); box-shadow:none}
:root[data-mode="2d"] .btn:hover::before{content:"▶"; font-size:.7em; display:inline-block; width:1.1em; margin-left:-1.1em}   /* sits in the padding, so hovering never changes the button's width */
.btn.sm{padding:5px 12px; font-size:var(--fs-sm)}
.btn.plain{background:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.actions .btn{flex:1 1 140px}

.stage{position:relative; display:grid; place-items:end center}
.stage::before{content:""; position:absolute; left:8%; right:8%; bottom:-2px; height:22px; background:var(--platform); border-radius:50%; pointer-events:none}
.bt-st{display:inline-block; margin-left:6px; padding:0 5px; border-radius:4px; font-size:10px; font-weight:800; letter-spacing:.04em; line-height:16px; color:#fff; background:#888; vertical-align:1px}
.bt-st[data-st="brn"]{background:#e2622b} .bt-st[data-st="par"]{background:#d9b416; color:#1c1600} .bt-st[data-st="psn"], .bt-st[data-st="tox"]{background:#9a3fb0} .bt-st[data-st="slp"]{background:#7d8597} .bt-st[data-st="frz"]{background:#4cb3d6}
:root[data-mode="2d"] .bt-st{border-radius:0; font-family:var(--font-px, inherit)}
.spr-hq{pointer-events:none}
.spr.hq-off{opacity:0}
.spr, .tr{position:relative; display:block; image-rendering:var(--pixel); max-width:100%; object-fit:contain}
img.spr:not([src]), img.tr:not([src]){visibility:hidden}
.stage.loading::after{content:""; position:absolute; inset:0; margin:auto; width:30px; height:30px; border-radius:50%;
  background:linear-gradient(var(--muted) 0 45%, transparent 45% 55%, var(--raised-2) 55%); opacity:.5; animation:spin 1.1s linear infinite}
:root[data-mode="2d"] .stage.loading::after{border-radius:0; animation:blink 1s steps(2) infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes blink{50%{opacity:.15}}
.medal{background:var(--medal-bg); border-radius:var(--medal-r); box-shadow:var(--medal-ring); overflow:hidden; place-items:end center}
.medal::before{display:none}
.medal .tr{width:100%; height:auto; max-height:none}

/* party (team) */
.trow{display:flex; align-items:center; gap:14px; padding:10px 12px; margin-bottom:12px; background:var(--slot-bg); border:var(--bw) solid var(--line); border-radius:var(--r-sm); flex-wrap:wrap}
:root:not([data-mode="2d"]) .trow{background:linear-gradient(100deg, var(--panel-2), var(--raised))}
.trow .stage{width:84px; height:84px; flex:none}
.tbtns{display:flex; flex-direction:column; gap:6px; align-items:stretch}
@media (max-width:440px){ .tbtns{flex-direction:row; flex-wrap:wrap; width:100%} .tbtns .btn{flex:1 1 auto} }
.tinfo{display:flex; flex-direction:column; gap:2px; flex:1 1 120px; min-width:0; align-items:flex-start}
.tinfo .k{font-size:var(--fs-xs); color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-family:var(--font-d); font-weight:700}
.tinfo b{font-family:var(--font-d); font-size:var(--fs-h2)}
:root:not([data-mode="2d"]) .tinfo b{font-style:italic}
.slots{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:380px){ .slots{grid-template-columns:repeat(2,minmax(0,1fr))} }
.slot{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 0 0; min-height:210px; overflow:hidden;
  background:var(--slot-bg); border:var(--bw) solid var(--line); border-radius:var(--r-sm); text-align:center}
:root[data-mode="2d"] .slot{box-shadow:inset 0 0 0 2px var(--hl); padding-bottom:8px}
.slot .stage{height:108px; width:100%}
.slot .spr{max-height:106px}
.slot .nm{font-family:var(--font-d); font-weight:700; font-size:var(--fs-sm); line-height:1.15; overflow-wrap:break-word; max-width:100%; padding-inline:6px}
:root:not([data-mode="2d"]) .slot .nm{font-style:italic}
.slot.empty{justify-content:center; border-style:dashed; color:var(--muted); font-size:var(--fs-sm); padding:10px}
.ghost{width:44px; height:44px; border-radius:50%; border:2px dashed var(--muted); opacity:.6; position:relative; display:block}
.ghost::after{content:""; position:absolute; left:-2px; right:-2px; top:50%; border-top:2px dashed var(--muted)}
:root[data-mode="2d"] .ghost, .w2 .ghost{border-radius:0}
.slot .x, .slot .info{position:absolute; top:6px; width:28px; height:28px; display:grid; place-items:center; cursor:pointer; padding:0; z-index:2;
  border:var(--bw) solid var(--line-2); background:var(--panel-solid); border-radius:50%; font-size:13px; line-height:1; color:var(--muted)}
.slot .x{right:6px} .slot .info{left:6px; font-family:var(--font-d); font-weight:700}
.slot .x:hover{color:var(--bad); border-color:var(--bad)}
:root[data-mode="2d"] .slot .x, :root[data-mode="2d"] .slot .info{border-radius:0; border-color:var(--line); font-size:16px}
  background:transparent; border:1px dashed var(--muted); border-radius:var(--pill); color:var(--muted)}
.types{display:flex; gap:4px; justify-content:center; flex-wrap:wrap}
.tb{display:inline-block; padding:2px 8px; border-radius:var(--pill); font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.05em; background:var(--tc); color:var(--tt); line-height:1.35; box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
:root[data-mode="2d"] .tb{border:2px solid var(--line); padding:0 6px; letter-spacing:.02em; box-shadow:none}

/* mini party bar: sticks to the top of the Pokédex while you scroll */
.party{display:none; position:sticky; top:env(safe-area-inset-top, 0px); z-index:6; align-items:center; gap:10px; margin:-6px -6px 12px; padding:8px 10px;
  background:var(--panel-2); border:var(--bw) solid var(--line-2); border-radius:var(--r-sm); box-shadow:0 10px 20px rgba(0,0,0,.25); flex-wrap:wrap}
:root[data-mode="2d"] .party{background:var(--paper); border-color:var(--line); box-shadow:var(--shadow), var(--inset)}
.layout.closed .party{display:flex}
@media (max-width:920px){ .party{display:flex} }
.party .pl{font-family:var(--font-d); font-weight:700; font-size:var(--fs-sm); white-space:nowrap}
:root:not([data-mode="2d"]) .party .pl{font-style:italic}
.party .minis{display:flex; gap:6px; flex:1 1 auto; min-width:0}
.mini{width:46px; height:46px; flex:none; display:grid; place-items:center; padding:0; cursor:pointer; background:var(--raised); border:var(--bw) solid var(--line); border-radius:50%; overflow:hidden; position:relative}
:root[data-mode="2d"] .mini{border-radius:0}
.mini .stage{width:100%; height:100%; place-items:center}
.mini .stage::before{display:none}
.mini .spr{max-width:44px; max-height:44px}
:root[data-mode="2d"] .mini .spr{max-width:none; max-height:none; width:44px; height:44px; object-fit:contain}
.mini.empty{border-style:dashed; cursor:default; opacity:.5}
@media (max-width:480px){ .mini{width:38px; height:38px} .mini .spr{max-width:36px; max-height:36px} :root[data-mode="2d"] .mini .spr{width:36px; height:36px} .party .pl{flex-basis:100%} }

/* coverage */
.cov{margin-top:14px; border:var(--bw) solid var(--line); border-radius:var(--r-sm); background:var(--raised)}
.cov-toggle{width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px; background:none; border:0; cursor:pointer; text-align:left; flex-wrap:wrap}
.cov-title{font-family:var(--font-d); font-weight:700; font-size:var(--fs-h2)}
:root:not([data-mode="2d"]) .cov-title{font-style:italic}
.cov-toggle .chev{margin-left:auto; transition:transform .2s; color:var(--muted)}
.cov-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.cov-body{padding:0 12px 12px}
.verdict p{margin:0}
.pill{display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:var(--pill); font-size:var(--fs-xs); font-weight:700; border:1px solid currentColor; font-family:var(--font-d)}
.pill.bad{color:var(--bad)} .pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.mute{color:var(--muted)}
.cov-h{font-family:var(--font-d); font-size:var(--fs-xs); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px}
.matrix{display:grid; grid-template-columns:repeat(auto-fill,minmax(62px,1fr)); gap:6px}
.cell{display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; border-radius:var(--r-sm); background:var(--panel); border:var(--bw) solid transparent; font-variant-numeric:tabular-nums}
.cell .ab{font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); padding:1px 6px; border-radius:var(--pill); background:var(--tc); color:var(--tt); letter-spacing:.04em}
.cell .ct{display:flex; gap:8px; font-size:var(--fs-xs); font-weight:600}
.cell .w{color:var(--bad)} .cell .r{color:var(--good)} .cell .z{color:var(--muted); opacity:.55}
.cell.sev2{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent)}
.cell.sev1{border-color:var(--warn)}
.legend{display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:var(--fs-xs); margin-top:8px}
.uncov{display:flex; flex-wrap:wrap; gap:4px}
.bar-off{height:10px; border-radius:var(--pill); background:var(--raised-2); overflow:hidden; margin:6px 0 8px}
.bar-off > i{display:block; height:100%; background:var(--good); border-radius:inherit}
:root[data-mode="2d"] .bar-off{border:2px solid var(--line); height:14px}

/* Pokédex */
.tools{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; align-items:stretch}
.search{flex:1 1 200px; min-width:0; padding:10px 16px; color:var(--fg); background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--pill)}
:root[data-mode="2d"] .search{border-radius:var(--r-sm)}
.search::placeholder{color:var(--muted)}
.select{padding:8px 12px; color:var(--fg); background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--pill); font-family:var(--font-d); font-weight:700}
:root[data-mode="2d"] .select{border-radius:var(--r-sm)}
.select option{background:var(--panel-solid); color:var(--fg)}
.favchip{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; cursor:pointer; font-family:var(--font-d); font-weight:700; font-size:var(--fs-sm); background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--pill); color:var(--muted)}
:root[data-mode="2d"] .favchip{border-radius:var(--r-sm)}
.favchip[aria-pressed="true"]{color:var(--fav); border-color:var(--fav); background:color-mix(in srgb, var(--fav) 14%, transparent)}
.chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px}
.chip{cursor:pointer; padding:3px 10px; border-radius:var(--pill); font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.05em; background:transparent; color:var(--fg); border:2px solid var(--tc)}
.chip[aria-pressed="true"]{background:var(--tc); color:var(--tt)}
.chip.all{--tc:var(--muted)}
.chip.all[aria-pressed="true"]{background:var(--hi); border-color:var(--hi); color:var(--on-hi)}
:root[data-mode="2d"] .chip{border-width:3px}
.progress{display:flex; align-items:center; gap:10px; margin-bottom:12px; color:var(--muted); font-size:var(--fs-sm)}
.progress .track{flex:1; height:6px; border-radius:var(--pill); background:var(--raised-2); overflow:hidden}
.progress .track i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent-2),var(--accent)); transition:width .2s}
:root[data-mode="2d"] .progress .track{height:12px; border:2px solid var(--line)}
:root[data-mode="2d"] .progress .track i{background:var(--good)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:10px}
@media (max-width:420px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px} }
.sect{grid-column:1/-1; display:flex; align-items:center; gap:10px; padding:10px 0 4px; margin-top:6px}
.sect:first-child{margin-top:0; padding-top:0}
.sect .k{font-family:var(--font-d); font-size:var(--fs-xs); font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--on-hi); background:var(--hi); padding:2px 14px; clip-path:var(--slant)}
:root[data-mode="2d"] .sect .k{color:var(--on-accent); background:var(--accent)}
.sect h3{font-size:var(--fs-h2)}
:root:not([data-mode="2d"]) .sect h3{font-style:italic}
.sect .meta{margin-left:auto}
.sect::after{content:""; order:2; flex:1; height:2px; background:var(--line)}
.sect .meta{order:3; margin-left:0}
.card{position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 0 0; cursor:pointer; text-align:center; overflow:hidden;
  background:linear-gradient(var(--raised), var(--panel-2)); border:var(--bw) solid var(--line); border-radius:var(--r-sm); transition:transform .15s, border-color .15s, background .15s}
.card:hover{transform:translateY(-3px); border-color:var(--line-2)}
.card .stage{height:96px; width:100%}
.card .spr{max-height:92px}
.card .no{font-size:var(--fs-xs); color:var(--muted); font-variant-numeric:tabular-nums; font-family:var(--font-d); font-weight:600}
.card .plate{align-self:stretch; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 4px 7px; background:var(--plate); color:var(--plate-fg); margin-top:2px}
.card .nm{font-family:var(--font-d); font-weight:700; font-size:var(--fs-sm); line-height:1.15; overflow-wrap:break-word; max-width:100%}
:root:not([data-mode="2d"]) .card .nm{font-style:italic}
.card .td{display:flex; gap:4px}
.card .td i{width:18px; height:5px; border-radius:3px; background:var(--tc)}
:root[data-mode="2d"] .card{background:var(--raised); padding-bottom:8px}
:root[data-mode="2d"] .card .plate{padding:0; margin:0}
:root[data-mode="2d"] .card:hover{transform:none; background:var(--hover-bg)}
:root[data-mode="2d"] .card .td i{border-radius:0; width:12px; height:12px; box-shadow:0 0 0 2px var(--line)}
.card .info, .card .fav{position:absolute; top:5px; width:26px; height:26px; padding:0; display:grid; place-items:center; cursor:pointer; z-index:2;
  border:2px solid var(--line-2); border-radius:50%; background:var(--panel-solid); color:var(--muted); font-family:var(--font-d); font-weight:700; font-size:12px; line-height:1}
.card .info{right:5px} .card .fav{left:5px; font-size:13px}
.fav[aria-pressed="true"]{color:var(--fav); border-color:var(--fav)}
:root[data-mode="2d"] .card .info, :root[data-mode="2d"] .card .fav{border-radius:0; border-color:var(--line); font-size:15px}
.card.sel{border-color:var(--hi); box-shadow:0 0 0 2px var(--hi), 0 0 18px color-mix(in srgb, var(--hi) 40%, transparent)}
.card.sel .plate{background:var(--hi); color:var(--on-hi)}
.card.sel::after{content:"✓"; position:absolute; top:34px; right:5px; z-index:2; width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:var(--hi); color:var(--on-hi); font-size:13px; font-weight:700}
:root[data-mode="2d"] .card.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; background:var(--sel-bg)}
:root[data-mode="2d"] .card.sel .plate{background:none}
:root[data-mode="2d"] .card.sel::after{border-radius:0; background:var(--accent); color:var(--on-accent)}
.grid.full .card:not(.sel){opacity:.72}
.empty-grid{grid-column:1/-1; padding:30px; text-align:center; color:var(--muted)}

/* overlays */
.tip{position:fixed; z-index:20; width:240px; padding:12px; pointer-events:none; background:var(--panel-solid); border:var(--bw) solid var(--line-2); border-radius:var(--r-sm); box-shadow:var(--shadow)}
.tip h3{font-size:var(--fs-sm); margin-bottom:6px}
.stats{display:grid; grid-template-columns:auto auto 1fr; gap:4px 8px; align-items:center; font-variant-numeric:tabular-nums}
.stats .l{font-size:var(--fs-xs); color:var(--muted); font-weight:700; font-family:var(--font-d)}
.stats .v{font-size:var(--fs-xs); text-align:right; font-weight:700}
.stats .b{height:8px; border-radius:var(--pill); background:var(--raised-2); overflow:hidden}
.stats .b i{display:block; height:100%; border-radius:inherit; background:var(--sc)}
:root[data-mode="2d"] .stats .b{height:12px; border:2px solid var(--line); border-radius:0}
:root[data-mode="2d"] .stats .b i{border-radius:0; background:repeating-linear-gradient(90deg, var(--sc) 0 6px, transparent 6px 8px)}
.stats .tot{grid-column:1/-1; display:flex; justify-content:space-between; padding-top:4px; border-top:1px dashed var(--line-2); font-size:var(--fs-xs); font-weight:700}
.modal-wrap{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top, 0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px)); background:rgba(5,8,18,.65)}
:root[data-mode="2d"] .modal-wrap{background:rgba(40,50,63,.45)}
.modal{width:min(460px,100%); max-height:100%; overflow:auto; background:var(--panel-solid); border:var(--bw) solid var(--line-2); border-radius:var(--r); box-shadow:var(--shadow), var(--inset); padding:18px; position:relative}
:root:not([data-mode="2d"]) .modal{border-top:6px solid var(--accent)}
.modal.wide{width:min(840px,100%)}
.modal .close{position:absolute; top:10px; right:10px; z-index:2}
.modal h3.mt{font-size:var(--fs-h1); line-height:1.05; padding-right:52px}
:root:not([data-mode="2d"]) .modal h3.mt{font-style:italic}
.hero{display:flex; gap:14px; align-items:center}
.hero .stage{width:150px; height:150px; flex:none}
.hero .spr{max-height:150px}
:root[data-mode="2d"] .hero .stage{height:auto; min-height:150px}
:root[data-mode="2d"] .hero .spr{max-height:none}
.hero .types{justify-content:flex-start; margin-top:6px}
.note{color:var(--muted); font-size:var(--fs-xs); margin:8px 0 0}
.modal .actions .btn{flex:1 1 160px}
@media (max-width:420px){ .hero{flex-direction:column; text-align:center} .hero .types{justify-content:center} }
.tsearch{width:100%; margin:12px 0 4px}
.tsect{font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px}
.tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px}
.tcard{display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 4px; cursor:pointer; background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm); font-family:var(--font-d); font-weight:700; font-size:var(--fs-sm); line-height:1.1; text-align:center}
.tcard:hover{background:var(--hover-bg)}
.tcard .stage{width:76px; height:76px}
.tcard.sel{border-color:var(--hi); background:var(--sel-bg); box-shadow:0 0 0 2px var(--hi)}
.vis-list{display:flex; flex-direction:column; gap:6px; margin-top:12px}
.vis-row{display:flex; align-items:center; gap:12px; padding:8px 12px; background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm)}
.vis-row .lab{flex:1; min-width:0}
.vis-row .lab b{font-family:var(--font-d); display:block}
.vis-row .lab span{color:var(--muted); font-size:var(--fs-xs)}
.switch{position:relative; width:52px; height:30px; flex:none; border-radius:var(--pill); border:var(--bw) solid var(--line-2); background:var(--raised-2); cursor:pointer; padding:0}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:left .15s}
.switch[aria-checked="true"]{background:var(--good); border-color:var(--good)}
.switch[aria-checked="true"]::after{left:24px; background:#fff}
:root[data-mode="2d"] .switch, :root[data-mode="2d"] .switch::after{border-radius:0}
.field{display:flex; flex-direction:column; gap:4px; margin-top:12px; font-size:var(--fs-sm); color:var(--muted)}
.field input{padding:9px 12px; color:var(--fg); background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm)}
.gifout{display:block; width:100%; height:auto; margin-top:12px; border:var(--bw) solid var(--line); border-radius:var(--r-sm)}
.toast{position:fixed; z-index:70; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom, 0px)); max-width:calc(100% - 32px);
  padding:10px 18px; background:var(--hi); color:var(--on-hi); border-radius:var(--r-sm); font-weight:700; box-shadow:var(--shadow); font-family:var(--font-d)}
:root[data-mode="2d"] .toast{background:var(--paper); color:var(--fg); border:3px solid var(--ink)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
/* ================= OVERLAYS: Hall of Fame + View team ================= */
html.noscroll, html.noscroll body{overflow:hidden}
.overlay{position:fixed; inset:0; z-index:50; background:#05070f; overflow:hidden; color:var(--fg)}
.overlay > canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
#hofCanvas{cursor:grab} #hofCanvas.dragging{cursor:grabbing}
.ov-bar{position:absolute; top:0; left:0; right:0; z-index:2; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 16px max(12px, env(safe-area-inset-left, 0px)); background:linear-gradient(rgba(5,7,15,.75), rgba(5,7,15,0)); pointer-events:none}
.ov-bar > *{pointer-events:auto}
.ov-name{font-family:var(--font-d); font-weight:700; font-size:var(--fs-h2); color:#fff; margin-right:auto; text-shadow:0 2px 10px rgba(0,0,0,.7)}
:root:not([data-mode="2d"]) .ov-name{font-style:italic}
.hof-panel{position:absolute; z-index:3; top:calc(64px + env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); width:min(340px, calc(100% - 24px)); max-height:calc(100% - 150px); overflow:auto; overscroll-behavior:contain; background:var(--panel-solid); border:var(--bw) solid var(--line-2); border-radius:var(--r); padding:14px; box-shadow:var(--shadow)}
.hp-h{font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px}
.hp-h:first-child{margin-top:0}
.bg-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px}
.bg-opt{padding:0; border:2px solid var(--line-2); border-radius:var(--r-sm); overflow:hidden; cursor:pointer; background:var(--raised); text-align:left; color:var(--fg)}
.bg-opt canvas{display:block; width:100%; height:auto; aspect-ratio:16/9}
.bg-opt span{display:block; padding:4px 8px; font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs)}
.bg-opt[aria-pressed="true"]{border-color:var(--hi); box-shadow:0 0 0 2px var(--hi)}
.segrow{display:flex; gap:4px; flex-wrap:wrap}
.segrow button{flex:1 1 auto; padding:6px 10px; cursor:pointer; border:2px solid var(--line-2); background:var(--raised); color:var(--fg); border-radius:var(--pill); font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs)}
.segrow button[aria-pressed="true"]{background:var(--hi); color:var(--on-hi); border-color:var(--hi)}
.segrow button:disabled{opacity:.4; cursor:not-allowed}

/* 2D: calmer — heavy outlines only on panels and primary actions */

:root[data-mode="2d"] :is(.card .info, .card .fav, .slot .x, .slot .info){border-color:var(--line-2)}
:root[data-mode="2d"] .tab{border-width:2px; border-color:var(--line-2); box-shadow:none}
:root[data-mode="2d"] .tab[aria-current="true"]{border-color:var(--line); box-shadow:3px 3px 0 var(--ink)}
:root[data-mode="2d"] .tb{border:0; padding:1px 7px}
:root[data-mode="2d"] .chip{border-width:2px}
:root[data-mode="2d"] :is(.seg, .toggle, .acct){box-shadow:none; border-width:2px}

:root[data-mode="2d"] .btn.primary{box-shadow:3px 3px 0 var(--ink)}

:root[data-mode="2d"] .modal{border-color:var(--line)}
:root[data-mode="2d"] .card.sel{border-color:var(--accent)}

/* View team: the party screen, full size */
.vt{display:grid; grid-template-columns:minmax(0,1fr) min(380px, 34vw); background:var(--bg); background-image:inherit; color:var(--fg); font-family:var(--font-b); font-size:var(--fs)}
:root:not([data-mode="2d"]) .vt{background-image:repeating-linear-gradient(135deg, var(--stripe) 0 14px, transparent 14px 28px), radial-gradient(70% 55% at 0% 0%, rgba(143,107,255,.18), transparent 70%)}
:root[data-mode="2d"] .vt{background-image:radial-gradient(var(--dots) 1.4px, transparent 1.5px); background-size:12px 12px}
.vt-main{display:flex; flex-direction:column; min-width:0; min-height:0; padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); padding-left:max(18px, env(safe-area-inset-left, 0px)); padding-right:18px; gap:14px}
.vt-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap}

:root:not([data-mode="2d"]) .vt-head h2{font-style:italic; background:linear-gradient(100deg, var(--accent), var(--accent-b)); color:var(--on-accent); padding:4px 26px 6px 18px; clip-path:var(--slant); margin-top:4px}
.vt-actions{display:flex; gap:8px}
.vt-stage{flex:1; min-height:0; display:flex; gap:18px; align-items:stretch}
.vt-trainer{flex:0 0 clamp(150px, 20%, 280px); display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px; padding:14px 10px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r); box-shadow:var(--shadow), var(--inset)}
.vt-tr{width:100%; flex:1; min-height:0; display:flex; align-items:flex-end; justify-content:center}
.vt-tr::before{left:4%; right:4%}
.vt-tr .tr{max-height:100%; max-width:100%; width:auto; height:auto; object-fit:contain}
:root:not([data-mode="2d"]) .vt-tr .tr{max-height:min(100%, 340px)}
.vt-tname{font-family:var(--font-d); font-weight:700; font-size:var(--fs-h2)}
:root:not([data-mode="2d"]) .vt-tname{font-style:italic; background:var(--plate); color:var(--plate-fg); padding:3px 18px; clip-path:var(--slant)}
.vt-slots{flex:1; min-width:0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); grid-template-rows:repeat(2, minmax(0,1fr)); gap:14px}
.vt-slot{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px; min-height:0; padding:12px 8px 14px; cursor:pointer; text-align:center; color:var(--fg);
  background:linear-gradient(var(--raised), var(--panel-2)); border:var(--bw) solid var(--line); border-radius:var(--r); box-shadow:var(--shadow), var(--inset); transition:transform .15s, border-color .15s}
.vt-slot:hover{transform:translateY(-3px)}
.vt-slot.on{border-color:var(--hi); box-shadow:0 0 0 3px var(--hi), var(--shadow)}
.vt-slot.empty{cursor:default; border-style:dashed; justify-content:center; opacity:.6}
:root[data-mode="2d"] .vt-slot{background:var(--slot-bg); box-shadow:inset 0 0 0 2px var(--hl), 4px 4px 0 color-mix(in srgb, var(--ink) 30%, transparent)}
:root[data-mode="2d"] .vt-slot.on{background:var(--sel-bg); border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--hl), 4px 4px 0 var(--ink)}
.vt-slot .stage{flex:1; width:100%; min-height:80px; display:flex; align-items:flex-end; justify-content:center}
.vt-slot .spr{max-height:100%; height:auto; width:auto; max-width:92%}
:root:not([data-mode="2d"]) .vt-slot .spr{image-rendering:auto}
.vt-slot:nth-child(2n) .spr{animation-delay:-1.1s} .vt-slot:nth-child(3n) .spr{animation-delay:-2s}
@keyframes breathe{0%,100%{transform:scale(1,1)} 50%{transform:scale(.99,1.025) translateY(-1%)}}
.vt-no{font-size:var(--fs-xs); color:var(--muted); font-family:var(--font-d); font-weight:600}
.vt-name{font-family:var(--font-d); font-weight:700; font-size:clamp(16px, 1.6vw, 22px); line-height:1.1}
:root:not([data-mode="2d"]) .vt-name{font-style:italic}
.vt-fav{position:absolute; top:8px; left:10px; color:var(--fav); font-size:18px}
.view-panel{position:relative; overflow:auto; overscroll-behavior:contain; background:var(--panel-solid); border-left:var(--bw) solid var(--line-2); padding:calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 18px}

.vp-title{font-size:var(--fs-h1)}
:root:not([data-mode="2d"]) .vp-title{font-style:italic}
@media (max-width:760px){

  .vt-stage{flex-direction:column}
  .vt-trainer{flex:none; flex-direction:row; justify-content:flex-start; padding:8px 12px}

  .vt-slots{grid-template-columns:repeat(2, minmax(0,1fr)); grid-template-rows:none}
  .vt-slot .stage{flex:none; height:120px}
  .view-panel{border-left:0; border-top:var(--bw) solid var(--line-2); padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
}

/* ================= SIGN IN: save-file select ================= */
html[data-view="signin"], html[data-view="signin"] body{min-height:100%}
.acc-screen{min-height:100vh; box-sizing:border-box; display:flex; justify-content:center; align-items:flex-start; padding-block:clamp(24px, 7vh, 72px) 32px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:#0e1729 repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 14px, transparent 14px 28px); color:var(--fg)}
:root[data-mode="2d"] .acc-screen{background:var(--bg) radial-gradient(var(--dots) 1.4px, transparent 1.5px) 0 0/12px 12px}

.acc-logo{display:flex; align-items:center; gap:12px; font-size:clamp(30px, 7vw, 56px); line-height:1}
.acc-logo .l2{font-family:"Pixelify Sans", monospace; font-weight:700; color:#d63a3a; text-shadow:3px 3px 0 #28323f, -2px -2px 0 #f8f8ec}
.acc-logo .l3{font-family:"Chakra Petch", sans-serif; font-weight:700; font-style:italic; color:#fff; text-shadow:2px 2px 0 #ff6a3d, 4px 4px 0 #8f6bff}
.acc-logo .emblem{width:clamp(40px, 7vw, 60px)}
.acc-card{width:100%; box-sizing:border-box; background:var(--panel-solid); border:var(--bw) solid var(--line-2); border-radius:var(--r); box-shadow:var(--shadow), var(--inset); padding:20px}
:root:not([data-mode="2d"]) .acc-card{border-top:6px solid var(--accent)}
.acc-title{font-size:var(--fs-h1); margin-bottom:14px}

.saves{display:flex; flex-direction:column; gap:10px; margin-bottom:12px}
.save{border:var(--bw) solid var(--line-2); border-radius:var(--r-sm); background:var(--raised); overflow:hidden}
.save:hover, .save.open{border-color:var(--hi)}

.save-main{width:100%; display:flex; align-items:center; gap:14px; padding:10px 14px; background:none; border:0; cursor:pointer; text-align:left; color:var(--fg)}
.save-av{width:64px; height:64px; flex:none}
.save-info{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1}
.save-info b{font-family:var(--font-d); font-size:var(--fs-h2)}
:root:not([data-mode="2d"]) .save-info b{font-style:italic}
.save-tags{display:flex; gap:6px; flex-wrap:wrap}
.save-go{color:var(--muted); font-size:14px}
.pin-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:0 14px 12px 92px}
.pin-row input, .pin-edit input{width:120px; padding:8px 12px; color:var(--fg); background:var(--panel-solid); border:var(--bw) solid var(--line); border-radius:var(--r-sm); letter-spacing:.3em; font-family:var(--font-d)}
.pin-edit{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.chk{flex-wrap:wrap}
@media (max-width:420px){ .pin-row{padding-left:14px} }
.chk{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:var(--fs-sm); color:var(--fg); cursor:pointer}
.chk input{width:18px; height:18px; accent-color:var(--accent)}
.acc-err{color:var(--bad); font-size:var(--fs-sm); margin:8px 0 0; font-weight:600}
.acc-head{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.acc-head .save-av{width:72px; height:72px}
.acct-av{width:28px; height:28px; border-radius:50%; overflow:hidden; flex:none; background:radial-gradient(circle at 50% 35%, #3a2f74, #161c3a 70%); display:grid; place-items:end center}
.acct-av .tr{width:100%; height:auto; image-rendering:auto}
:root[data-mode="2d"] .acct-av{border-radius:0}
.acct[data-s="readonly"] .dot{background:var(--warn)}
.btn.danger{color:var(--bad); border-color:var(--bad)}
.btn.danger[data-armed="1"]{background:var(--bad); color:#fff}
.start-foot b{color:#fff}

/* drag to reorder */
.drag-ghost{position:fixed; z-index:80; pointer-events:none; opacity:.92; transform:rotate(-2deg) scale(1.04); box-shadow:0 18px 40px rgba(0,0,0,.45); margin:0}
.drag-src{opacity:.3}
html.sorting, html.sorting *{cursor:grabbing!important; user-select:none}
.tab{transition:transform .12s} .tab.drop-before{transform:translateX(16px); background:var(--raised-2)} .tab.drop-after{transform:translateX(-16px); background:var(--raised-2)}
.slot.drop-before, .slot.drop-after{outline:3px dashed var(--hi); outline-offset:2px}
.vis-row.drop-before{box-shadow:0 -3px 0 0 var(--hi)} .vis-row.drop-after{box-shadow:0 3px 0 0 var(--hi)}

.slot[data-num]{cursor:grab} .tab{touch-action:pan-x} .slot{touch-action:pan-y}
.grip{cursor:grab; font-size:20px; color:var(--muted); padding:4px 6px; touch-action:none; user-select:none}
.mv{display:flex; gap:4px}
.mv .btn{padding:4px 9px}
.sortlist .vis-row{gap:10px}

/* full-screen buttons: four corner brackets that point out (enter) or in (exit) */
.fsbtn{min-width:44px; justify-content:center; padding-inline:12px}
.fs-ic{position:relative; display:inline-block; width:16px; height:16px;
  background:
    linear-gradient(currentColor,currentColor) 0 0/6px 2px, linear-gradient(currentColor,currentColor) 0 0/2px 6px,
    linear-gradient(currentColor,currentColor) 100% 0/6px 2px, linear-gradient(currentColor,currentColor) 100% 0/2px 6px,
    linear-gradient(currentColor,currentColor) 0 100%/6px 2px, linear-gradient(currentColor,currentColor) 0 100%/2px 6px,
    linear-gradient(currentColor,currentColor) 100% 100%/6px 2px, linear-gradient(currentColor,currentColor) 100% 100%/2px 6px;
  background-repeat:no-repeat}
[data-fs][aria-pressed="true"] .fs-ic{transform:scale(.7); outline:2px solid currentColor; outline-offset:-1px; background:none}
.start-fs{display:inline-grid; place-items:center; width:52px; height:52px; padding:0; cursor:pointer; border-radius:999px; border:2px solid rgba(255,255,255,.3); background:rgba(11,18,34,.8); color:#fff; backdrop-filter:blur(8px)}
:root[data-mode="2d"] .start-fs{border-radius:0; border:3px solid var(--ink); background:var(--paper); color:var(--fg)}

.szctl{display:inline-flex; align-items:center; gap:6px}
.szctl input[type=range]{width:clamp(90px, 14vw, 170px); accent-color:var(--hi)}
:root[data-mode="2d"] .szctl input[type=range]{accent-color:var(--accent)}
.szctl output{min-width:44px; text-align:center; font-family:var(--font-d); font-weight:700; font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.4; cursor:not-allowed}
/* ================= personalization, filters, undo, modes ================= */
.ball-ic{width:18px; height:18px; flex:none; image-rendering:pixelated; vertical-align:-3px}
.ball-ic.lg{width:27px; height:27px; margin-right:8px; vertical-align:-2px}
.slot{min-height:172px; cursor:pointer}
.slot .nm{display:flex; align-items:center; justify-content:center; gap:5px; margin-top:auto; padding:0 6px 10px}
.slot .nm .nt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
:root[data-mode="2d"] .slot .nm{padding-bottom:2px}
.actions .btn.undo{flex:0 0 auto; padding-inline:14px}
.ph .right .btn.more{min-width:36px; padding-inline:8px; font-size:18px; line-height:1; letter-spacing:.05em}
.toast{display:flex; align-items:center; gap:14px}
.toast-act{border:0; background:transparent; color:inherit; font:inherit; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:2px 4px}

/* filters */
.fbtn{position:relative}
.fbtn.on{color:var(--fg); border-color:var(--hi)}
.fbadge{display:inline-grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:var(--pill); background:var(--hi); color:var(--on-hi); font-size:12px; line-height:1}
.fpanel{margin:-2px 0 12px; padding:12px 14px; background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm); display:grid; gap:10px}
:root[data-mode="2d"] .fpanel{border-width:2px; border-color:var(--line-2)}
.frow{display:grid; grid-template-columns:118px minmax(0,1fr); gap:10px; align-items:center}
.frow .fl{font-family:var(--font-d); font-weight:700; font-size:var(--fs-xs); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.frow .segrow button{flex:0 1 auto; padding:4px 12px}
.frow .segrow.gens button{min-width:38px; flex:0 0 auto}

.ftg{display:flex; flex-wrap:wrap; gap:6px}
.fchip{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; cursor:pointer; font-family:var(--font-d); font-weight:700; font-size:var(--fs-sm); background:var(--panel-solid); border:2px solid var(--line-2); border-radius:var(--pill); color:var(--muted)}
.fchip[aria-pressed="true"]{color:var(--on-hi); background:var(--hi); border-color:var(--hi)}
:root[data-mode="2d"] .fchip{border-radius:var(--r-sm)}
@media (max-width:560px){ .frow{grid-template-columns:1fr; gap:4px} }
.empty-grid .btn{margin-top:10px}

/* sheet tabs + personalize */
.sheet-tabs{margin:14px 0 4px}
.build .field{margin-top:10px}
.field textarea{padding:9px 12px; color:var(--fg); background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm); font:inherit; resize:vertical; min-height:80px}
.field .select{border-radius:var(--r-sm); padding:9px 10px}
.ball-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(38px,1fr)); gap:5px}
.ball-opt{display:grid; place-items:center; aspect-ratio:1; padding:0; cursor:pointer; background:var(--raised); border:2px solid var(--line-2); border-radius:var(--r-sm)}
.ball-opt .ball-ic{width:27px; height:27px}
.ball-opt:hover{background:var(--hover-bg)}
.ball-opt[aria-checked="true"]{border-color:var(--hi); background:var(--sel-bg); box-shadow:0 0 0 2px var(--hi)}
:root[data-mode="2d"] .ball-opt[aria-checked="true"]{border-color:var(--accent); box-shadow:none}
.cov-h .meta{text-transform:none; letter-spacing:0; font-weight:500; margin-left:6px}
.b2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.b2 > *{min-width:0} .b2 input, .b2 select{width:100%; min-width:0; box-sizing:border-box}
@media (max-width:480px){ .b2{grid-template-columns:1fr} }
.mv-list{display:grid; grid-template-columns:1fr; gap:6px}
.mv-row{display:flex; align-items:center; gap:6px; padding:4px 8px 4px 4px; background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm); min-width:0}
:root[data-mode="2d"] .mv-row{border-width:2px; border-color:var(--line-2)}
.mv-ty{flex:none; width:38px; padding:3px 0; text-align:center; border-radius:var(--pill); font-family:var(--font-d); font-weight:700; font-size:11px; background:var(--tc, var(--raised-2)); color:var(--tt, var(--muted))}

.mv-row input:focus-visible{outline:none}
.mv-row:focus-within{border-color:var(--hi)}
.mv-meta{flex:none; font-size:var(--fs-xs); color:var(--muted); white-space:nowrap}
.vp-build{display:grid; gap:6px; margin-top:4px}
.vp-build .kv{display:flex; gap:8px; align-items:baseline; font-size:var(--fs-sm)}
.vp-build .kv span:first-child{min-width:62px; color:var(--muted); font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.08em; font-family:var(--font-d); font-weight:700}
.vp-moves{display:flex; flex-wrap:wrap; gap:5px}
.vt-name .ball-ic{width:20px; height:20px; margin-right:6px}
.vt-no .sp{opacity:.85}
.vp-note{margin:10px 0 0; padding:10px 12px; background:var(--raised); border-radius:var(--r-sm); border:var(--bw) solid var(--line)}
.vp-note p{margin:6px 0 0; white-space:pre-wrap; font-size:var(--fs-sm)}
.stars-ro{color:var(--hi); letter-spacing:2px} .stars-ro span{color:var(--line-2)}
:root[data-mode="2d"] .stars-ro{color:var(--accent)}

/* team options */
.stars{display:flex; gap:4px}
.stars button{width:40px; height:40px; padding:0; cursor:pointer; font-size:26px; line-height:1; background:none; border:0; color:var(--line-2); transition:transform .12s}
.stars button.on{color:var(--hi)}
:root[data-mode="2d"] .stars button.on{color:var(--accent)}
.stars button:hover{transform:scale(1.15)}
.code-row{display:flex; gap:8px; align-items:center}
.code-row code{flex:1; min-width:0; overflow-wrap:anywhere; padding:9px 12px; background:var(--raised); border:var(--bw) dashed var(--line-2); border-radius:var(--r-sm); font-family:ui-monospace, "SFMono-Regular", Menlo, monospace; font-size:14px; user-select:all}
:root[data-mode="2d"] .code-row code{font-family:"VT323", monospace; font-size:20px}
.code-load{display:flex; gap:8px}
.code-load .search{flex:1; border-radius:var(--r-sm)}

/* start screen modes */
:root[data-mode="2d"] .smode{font-family:"Pixelify Sans", monospace; font-style:normal; border-radius:0; background:var(--paper); color:var(--fg); border:3px solid var(--ink); backdrop-filter:none; font-size:15px}
:root[data-mode="2d"] .smode:hover{background:var(--sel-bg)}
:root[data-mode="2d"] .smode .ic{border-radius:0; background:var(--accent); color:var(--on-accent)}

/* who's that pokemon */
.qz-bar{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:10px; font-family:var(--font-d); font-weight:700}
.qz-bar b{color:var(--hi); font-size:1.2em} :root[data-mode="2d"] .qz-bar b{color:var(--accent)}
.qz-bar .select{margin-left:auto}
.qz-stage{position:relative; margin:12px 0; height:230px; display:grid; place-items:center; border-radius:var(--r); overflow:hidden;
  background:radial-gradient(circle at 50% 55%, #ffffff 0 18%, #ffe27a 19% 34%, #ffb12b 35% 52%, #3f8fe0 53%)}
:root[data-mode="2d"] .qz-stage{border-radius:0; border:3px solid var(--line); background:repeating-conic-gradient(from 0deg at 50% 55%, #ffe27a 0 10deg, #ffcf4a 10deg 20deg)}
.qz-stage .stage{width:100%; height:100%; place-items:center}
.qz-stage .stage::before{display:none}
.qz-stage .spr{max-height:200px; max-width:90%; transition:filter .6s ease}
.qz-stage .spr.sil{filter:brightness(0)}
.qz-stage.reveal .spr{animation:qzpop .5s ease}
@keyframes qzpop{0%{transform:scale(.9)} 60%{transform:scale(1.08)} 100%{transform:scale(1)}}
.qz-opts{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.qz-opt{justify-content:flex-start; text-align:left}
.qz-opt .k{display:inline-grid; place-items:center; width:22px; height:22px; flex:none; border-radius:50%; background:var(--raised-2); font-size:12px}
:root[data-mode="2d"] .qz-opt .k{border-radius:0}
.qz-opt.right{background:var(--good); border-color:var(--good); color:#08240f; opacity:1}
.qz-opt.wrong{background:var(--bad); border-color:var(--bad); color:#fff; opacity:1}
.qz-opt:disabled:not(.right):not(.wrong){opacity:.5}
.qz-foot{display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:52px; margin-top:6px}
.qz-msg{margin:0}

/* rival battle */
.rv-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px}
.tcard.rv{flex-direction:row; text-align:left; padding:6px 10px 6px 6px; gap:10px}
.tcard.rv .stage{width:52px; height:52px; flex:none}
.rv-t{display:flex; flex-direction:column; min-width:0}
.rv-t small{font-family:var(--font-b); font-weight:500; color:var(--muted); font-size:var(--fs-xs)}
.rv-t small.won{color:var(--good); font-weight:700}
.bt-head{display:flex; gap:12px; align-items:center; padding-right:48px}
.bt-head .stage{width:56px; height:56px; flex:none}
.bt-field{position:relative; aspect-ratio:16/9; margin-top:12px; overflow:hidden; border-radius:var(--r-sm); border:var(--bw) solid var(--line); background:#203048}
.bt-bg{position:absolute; inset:0; width:100%; height:100%; display:block}
:root[data-mode="2d"] .bt-bg{image-rendering:pixelated}
.bt-mon{position:absolute; width:34%; height:44%; display:flex; align-items:flex-end; justify-content:center}
.bt-mon .stage{width:100%; height:100%; place-items:end center}
.bt-mon .stage::before{display:none}
.bt-mon .spr{max-height:100%; max-width:100%; filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.bt-mon::after{content:""; position:absolute; bottom:-4%; left:22%; right:22%; height:12%; border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.4), transparent); z-index:-1}
.bt-mon.foe{right:8%; top:16%}
.bt-mon.you{left:8%; bottom:8%}
.bt-mon.you .spr{transform:scaleX(-1)}
.bt-mon.enter .stage{animation:btin .45s ease-out}
.bt-mon.lunge.you .stage{animation:btlungeL .35s ease}
.bt-mon.lunge.foe .stage{animation:btlungeR .35s ease}
.bt-mon.hit .stage{animation:bthit .5s steps(2)}
.bt-mon.faint .stage{animation:btfaint .55s ease-in forwards}
@keyframes btin{from{transform:scale(.2); opacity:0; filter:brightness(4)} to{transform:none; opacity:1; filter:none}}
@keyframes btlungeL{50%{transform:translate(10%,-6%)}}
@keyframes btlungeR{50%{transform:translate(-10%,6%)}}
@keyframes bthit{0%,40%,80%{opacity:.15} 20%,60%,100%{opacity:1}}
@keyframes btfaint{to{transform:translateY(40%); opacity:0}}
.bt-hp{position:absolute; width:38%; max-width:260px; padding:6px 10px; background:rgba(248,248,236,.94); color:#1d2631; border:2px solid #28323f; border-radius:10px 2px; box-shadow:3px 3px 0 rgba(0,0,0,.25); font-family:var(--font-d); font-size:13px}
:root[data-mode="2d"] .bt-hp{border-radius:0; border-width:3px; font-size:17px}
.bt-hp.foe{left:3%; top:5%}
.bt-hp.you{right:3%; bottom:12%}
.bt-row{display:flex; justify-content:space-between; gap:6px}
.bt-row .bt-st{margin-right:auto}
@media (max-width:560px){
  .top{gap:10px}
  .top .brand .sub{display:none}
  .top .controls{gap:8px; width:100%; flex-wrap:nowrap}
  .top .acct{margin-left:auto; padding:6px 10px}
  .top .acct .t{display:none}
  .top .acct{gap:6px; min-width:44px; justify-content:center}
  .top .seg .k{display:none}
  .top .toggle{padding:8px 12px}
}
.acc-tag{margin:-6px 0 18px; text-align:center; font:600 13px var(--font-d, sans-serif); letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.7)}
.wl{display:grid; gap:14px; margin:14px 0 4px}
.wl-row{display:grid; grid-template-columns:40px 1fr; gap:12px; align-items:start}
.wl-row .ic{width:40px; height:40px; display:grid; place-items:center; border-radius:12px; background:var(--accent); color:#fff}
.wl-row .ic svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.wl-row b{font-family:var(--font-d)} .wl-row p{margin:2px 0 0; font-size:var(--fs-sm); color:var(--muted)}
:root[data-mode="2d"] .wl-row .ic{border-radius:0}
.qz-dots{display:inline-flex; gap:4px; align-items:center}
.qz-dots i{width:10px; height:10px; border-radius:50%; background:var(--raised-2); border:1px solid var(--line-2)}
.qz-dots i.ok{background:var(--good); border-color:var(--good)} .qz-dots i.no{background:var(--bad); border-color:var(--bad)}
.qz-dots.big i{width:16px; height:16px}
:root[data-mode="2d"] .qz-dots i{border-radius:0}
.daily-done{display:grid; justify-items:center; gap:10px; text-align:center; padding:28px 16px; margin-top:12px; background:var(--panel); border:var(--bw) solid var(--line); border-radius:var(--r)}
.daily-done .k{font:700 var(--fs-xs) var(--font-d); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.daily-score{font:700 64px/1 var(--font-d)} .daily-score small{font-size:24px; color:var(--muted)}
.sug-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px}
.sug{display:inline-flex; align-items:center; gap:4px; padding:3px 10px 3px 6px; border-radius:var(--pill); border:1.5px solid var(--line-2); background:var(--raised); color:var(--fg); font:700 var(--fs-xs) var(--font-d); cursor:pointer}
.sug:hover{border-color:var(--accent)} .sug i{width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--tc)}
:root[data-mode="2d"] .sug{border-radius:0} :root[data-mode="2d"] .sug i{border-radius:0}
.bt-nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bt-lv{flex:none; color:#4f5d6b}
.bt-bar{display:block; height:7px; margin-top:4px; background:#4f5d6b; border:1px solid #28323f; border-radius:4px; overflow:hidden}
.bt-bar i{display:block; height:100%; width:100%; background:#46c46a; transition:width .6s ease, background .3s}
.bt-bar i[data-l="y"]{background:#f2c230} .bt-bar i[data-l="r"]{background:#e8473f}
.bt-num{display:block; text-align:right; font-size:12px; margin-top:2px; font-variant-numeric:tabular-nums}
.bt-party{position:absolute; display:flex; gap:2px; padding:3px 6px; background:rgba(11,18,34,.55); border-radius:999px}
.bt-party.foe{left:3%; top:calc(5% + 58px)}
.bt-party.you{right:3%; bottom:3%}
.bt-party .ball-ic{width:16px; height:16px}
.bt-party .out{opacity:.3; filter:grayscale(1)}
:root[data-mode="2d"] .bt-party{border-radius:0}
.bt-log{min-height:58px; margin-top:10px; padding:10px 14px; background:var(--raised); border:var(--bw) solid var(--line); border-radius:var(--r-sm); font-size:var(--fs)}
.bt-log p{margin:0}
.bt-log.win{border-color:var(--good)} .bt-log.loss{border-color:var(--bad)}
:root[data-mode="2d"] .bt-log{background:var(--paper); border:3px solid var(--ink); box-shadow:inset 0 0 0 2px var(--frame)}
@media (max-width:560px){ .bt-hp{font-size:11px; padding:4px 7px} .bt-party.foe{top:calc(5% + 46px)} .qz-stage{height:190px} }
:root:not([data-mode="2d"]) .bt-mon{height:52%}
:root:not([data-mode="2d"]) .bt-mon .spr{min-height:82%; width:auto}
:root:not([data-mode="2d"]) .bt-mon.foe{top:10%}
@media (max-width:620px){
  .bt-field{aspect-ratio:5/4}
  .bt-hp{width:47%; max-width:none}
  .bt-hp.foe{left:2.5%; top:3%}
  .bt-party.foe{left:2.5%; top:calc(3% + 44px)}
  .bt-mon.foe{right:3%; top:7%; width:44%; height:38%}
  .bt-mon.you, :root:not([data-mode="2d"]) .bt-mon.you{left:3%; bottom:4%; width:47%; height:46%}
  :root:not([data-mode="2d"]) .bt-mon.foe{top:7%; height:38%}
  .bt-hp.you{right:2.5%; bottom:15%}

}
/* ================= THEMES (per save file: 3D theme, 2D theme, accent, text size, motion) ================= */
:root:not([data-mode="2d"])[data-t3="daylight"]{
  --bg:#eef2fa; --bg-2:#e4eaf6; --stripe:rgba(30,50,110,.035);
  --panel:#ffffff; --panel-solid:#ffffff; --panel-2:#f2f5fc; --raised:#f2f5fc; --raised-2:#e2e8f5;
  --line:#cfd8ec; --line-2:#b4c0dc; --fg:#17203a; --muted:#59668a;
  --slot-bg:#f3f6fd; --hover-bg:#e7edfb; --sel-bg:#fff3c4; --plate:#1b2542; --plate-fg:#ffffff;
  --shadow:0 10px 26px rgba(30,50,110,.13); --inset:inset 0 1px 0 rgba(255,255,255,.9);
  --medal-bg:radial-gradient(circle at 50% 35%, #e3e8ff, #b8c4ee 70%);
  --platform:radial-gradient(closest-side, rgba(143,107,255,.32), rgba(143,107,255,.1) 60%, transparent);
  --sb-track:#e4eaf6; --sb-pad:3px solid #e4eaf6; color-scheme:light;
}
:root:not([data-mode="2d"])[data-t3="carbon"]{
  --bg:#07070a; --bg-2:#0d0d11; --stripe:rgba(255,255,255,.018);
  --panel:#111116; --panel-solid:#111116; --panel-2:#16161c; --raised:#1a1a21; --raised-2:#24242d;
  --line:#2a2a34; --line-2:#3b3b48; --fg:#f3f3f6; --muted:#9b9bad;
  --slot-bg:#16161c; --hover-bg:#22222b; --sel-bg:#2b2b36; --plate:#000000;
  --medal-bg:radial-gradient(circle at 50% 35%, #34343f, #111116 70%);
  --sb-track:#07070a; --sb-pad:3px solid #07070a;
}
:root:not([data-mode="2d"])[data-t3="ultra"]{
  --bg:#110925; --bg-2:#170d32; --stripe:rgba(160,120,255,.04);
  --panel:#1a1137; --panel-solid:#1a1137; --panel-2:#211648; --raised:#251a58; --raised-2:#31226e;
  --line:#3d2c80; --line-2:#5741aa; --fg:#f6f1ff; --muted:#b9a9e8; --accent-2:#2fd0ff;
  --slot-bg:#211648; --hover-bg:#2c1e63; --sel-bg:#3a2572; --plate:#0c061f;
  --medal-bg:radial-gradient(circle at 50% 35%, #4b2f9a, #160d33 70%); --medal-ring:0 0 0 3px #ffffff, 0 0 0 6px #2fd0ff;
  --platform:radial-gradient(closest-side, rgba(47,208,255,.45), rgba(47,208,255,.12) 60%, transparent);
  --sb-track:#0c061f; --sb-pad:3px solid #0c061f; --sb-v:linear-gradient(#2fd0ff, #c46bff); --sb-h:linear-gradient(90deg, #2fd0ff, #c46bff);
}

  --bg:#9bbc0f; --bg-2:#9bbc0f; --dots:#8bac0f;
  --panel:#c9da8d; --panel-solid:#c9da8d; --panel-2:#c9da8d; --paper:#c9da8d; --raised:#b4ca68; --raised-2:#a3bc4e;
  --ink:#0f380f; --line:#0f380f; --line-2:#306230; --fg:#0f380f; --muted:#306230; --frame:#8bac0f; --hl:#dce8ac;
  --accent:#306230; --accent-b:#306230; --accent-d:#0f380f; --on-accent:#dce8ac; --accent-2:#306230;
  --hi:#8bac0f; --on-hi:#0f380f; --sel-bg:#e2edb4; --slot-bg:#bfd27a; --hover-bg:#d6e4a0;

  --ink:#070a12; --line:#070a12; --line-2:#4b5a7c; --fg:#eef0e2; --muted:#a6b1c8; --frame:#4a5f8c; --hl:#3d4a68;
  --accent:#e2574e; --accent-b:#e2574e; --accent-d:#8f2620;

/* accent colours (both styles) */
html:root[data-accent="red"][data-mode]{--accent:#e2413b; --accent-b:#ff6b5c; --accent-d:#9a231e}
html:root[data-accent="blue"][data-mode]{--accent:#2f7bf5; --accent-b:#5aa3ff; --accent-d:#1a4fb0}
html:root[data-accent="green"][data-mode]{--accent:#1fa463; --accent-b:#3fd18a; --accent-d:#13693f}
html:root[data-accent="purple"][data-mode]{--accent:#8a55f0; --accent-b:#b18cff; --accent-d:#5a2fb3}
html:root[data-accent="pink"][data-mode]{--accent:#e8458f; --accent-b:#ff7cb6; --accent-d:#a3245f}

/* text size */
:root[data-text="large"]{--fs:16.5px; --fs-sm:14.5px; --fs-xs:13px; --fs-h1:28px; --fs-h2:19px}
:root[data-mode="2d"][data-text="large"]{--fs:22px; --fs-sm:20px; --fs-xs:18px; --fs-h1:31px; --fs-h2:23px}
/* motion */
:root[data-motion="reduced"] *, :root[data-motion="reduced"] *::before, :root[data-motion="reduced"] *::after{animation:none!important; transition:none!important}
/* ================= MAIN MENU (over the title scene) ================= */
.ic{display:inline-grid; place-items:center; flex:none}
.ic svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.corner-btns{position:absolute; top:max(14px, env(safe-area-inset-top, 0px)); right:max(14px, env(safe-area-inset-right, 0px)); z-index:5; display:flex; gap:8px}
.snd{width:44px; height:44px; padding:10px; display:grid; place-items:center; cursor:pointer; color:#fff; border:2px solid rgba(255,255,255,.3); border-radius:999px; background:rgba(11,18,34,.75); backdrop-filter:blur(8px)}
.snd svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
:root[data-mode="2d"] .snd{border-radius:0; background:var(--paper); color:var(--fg); border:3px solid var(--ink); backdrop-filter:none}
.hub{display:flex; flex-direction:column; align-items:center; gap:10px; width:min(1240px, 100%); margin:0 auto}
html[data-view="hub"] .start-bottom{display:none}

html[data-view="hub"] .start-shade{background:linear-gradient(rgba(5,7,15,.6), rgba(5,7,15,.25) 30%, rgba(5,7,15,.55) 60%, rgba(5,7,15,.88))}

.hub-tile{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:8px; min-height:0; padding:12px; text-align:left; cursor:pointer; color:#fff; border:2px solid rgba(255,255,255,.18); border-radius:16px; background:rgba(11,18,34,.78); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:transform .12s, border-color .12s, background .12s}
.hub-tile:hover, .hub-tile:focus-visible{transform:translateY(-2px); border-color:#ffd43b; background:rgba(22,32,60,.9)}
.hub-tile .ic{width:34px; height:34px; padding:7px; border-radius:10px; background:rgba(255,255,255,.1); color:#ffd43b}
.hub-tile.big{flex-direction:row; align-items:center; gap:12px; background:linear-gradient(100deg, var(--accent), var(--accent-b)); border-color:rgba(255,255,255,.6)}
.hub-tile.big .ic{background:rgba(255,255,255,.22); color:#fff}
.hub-tile.big:hover{background:linear-gradient(100deg, var(--accent), var(--accent-b)); border-color:#fff}
.ht{display:flex; flex-direction:column; gap:2px; min-width:0}
.ht b{font-family:"Chakra Petch", sans-serif; font-style:italic; font-weight:700; font-size:16px; line-height:1.1}
.ht .hm{font-size:11.5px; opacity:.85}
.ht span{font-family:"Rubik", sans-serif; font-size:12.5px; color:rgba(255,255,255,.78); line-height:1.25}

/* thumbnails */
.it-thumb{display:grid; place-items:center; width:100%; max-width:160px; aspect-ratio:5/3; border-radius:var(--r-sm); background:var(--raised-2); overflow:hidden}

:root[data-mode="2d"] .it-thumb canvas{image-rendering:pixelated}
.ball-ic.xl{width:58px; height:58px}
.card-sw{position:relative; display:block; width:min(130px, 86%); aspect-ratio:1000/620; border-radius:8px; overflow:hidden; background:linear-gradient(135deg, var(--a), var(--b)); box-shadow:0 2px 6px rgba(0,0,0,.25)}
.card-sw::before{content:""; position:absolute; inset:0}
.card-sw i{position:absolute; left:7%; right:7%; top:22%; bottom:9%; border-radius:4px; background:var(--c)}
.card-sw.glow::before{background:radial-gradient(circle at 85% 5%, rgba(255,255,255,.6), transparent 60%)}
.card-sw.wave::before{background:repeating-radial-gradient(circle at 0 120%, transparent 0 6px, rgba(255,255,255,.2) 6px 8px)}
.card-sw.grid::before{background-image:linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px); background-size:7px 7px}
.card-sw.stars::before{background-image:radial-gradient(#fff 1px, transparent 1.6px), radial-gradient(rgba(255,255,255,.6) 1px, transparent 1.4px); background-size:13px 11px, 7px 9px; background-position:0 0, 4px 3px}
.card-sw.holo::before{background:linear-gradient(115deg, rgba(255,90,200,.55), rgba(90,200,255,.55), rgba(255,240,90,.55), rgba(90,255,170,.55))}

/* Shop */
.shop{display:grid; gap:14px}

/* rewards + unlock prompts */
.reward-list{display:grid; gap:10px; margin:12px 0}

.bg-opt{position:relative}

.bg-opt .lock{position:absolute; top:6px; right:6px; display:inline-flex; align-items:center; white-space:nowrap; padding:3px 8px; border-radius:999px; background:rgba(11,18,34,.88); color:#fff; font:700 12px/1.3 "Rubik", sans-serif; font-style:normal}

.card-wrap{grid-template-columns:minmax(0, 1fr) 330px}

:root[data-mode="2d"] .card-opt, :root[data-mode="2d"] .icon-opt{border-radius:0}

/* Battle menu: Gym challenge is the main event */
.bm-main{grid-column:1/-1; display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); gap:18px 28px; align-items:center; padding:24px 26px; color:#fff; background:linear-gradient(115deg, var(--accent), var(--accent-b)); border-color:transparent; box-shadow:0 12px 32px rgba(0,0,0,.25)}

:root[data-mode="2d"] .bm-main{background:var(--accent); color:var(--on-accent); border:3px solid var(--ink); box-shadow:6px 6px 0 var(--ink)}

@media (max-width:860px){ .bm-main{grid-template-columns:1fr} }
@media (max-width:420px){ .bm-main{padding:18px} .bm-ld .stage, .bm-ld .emblem-tr{width:52px; height:52px} }

/* Hall of Fame gallery */
.hgal{display:grid; gap:14px}
.hgal-top{display:flex; gap:12px 18px; align-items:center; flex-wrap:wrap}

const THEMES = [
  {id:"starters", label:"Starters", name:"First Partners", tr:"Hop", blurb:"The 27 first-stage starters", nums:[1,4,7,152,155,158,252,255,258,387,390,393,495,498,501,650,653,656,722,725,728,810,813,816,906,909,912]},

  {id:"ub", label:"Ultra Beasts", name:"Ultra Beasts", tr:"Lusamine", blurb:"Visitors from Ultra Space", nums:TAGS.ub},
  {id:"paradox", label:"Paradox", name:"Paradox Pokémon", tr:"Arven", blurb:"Ancient and Future forms from Area Zero", nums:[...new Set([...TAGS.paradox, 1020,1021,1022,1023])].sort((a,b)=>a-b)},
  {id:"fossil", label:"Fossils", name:"Fossil Pokémon", tr:"Brock", blurb:"Revived from fossils", nums:[138,139,140,141,142,345,346,347,348,408,409,410,411,564,565,566,567,696,697,698,699,880,881,882,883]},
  {id:"baby", label:"Babies", name:"Baby Pokémon", tr:"Lillie", blurb:"Pre-evolutions that hatch from Eggs", nums:[172,173,174,175,236,238,239,240,298,360,406,433,438,439,440,446,447,458,848]},

];

      both:d.both === true || d.both === "true", forms:CT_FORMS.includes(d.forms) ? d.forms : "show",

}

  const B = BUILTIN.find(t => t.id === d.base) || BUILTIN.find(t => t.id === "all"), r = BST_R[d.bst] || BST_R.any;

    if (d.forms === "regional" && !(f && f !== "Mega" && f !== "Primal")) return false;
    if (d.forms === "only" && !f) return false;
    if (d.forms === "hide" && f) return false;
    if (d.leg !== "all" && (d.leg === "only") !== isLegend(n)) return false;
    if (d.fe && !isFE(n)) return false;
    const b = bst(m); if (b < r[0] || b > r[1]) return false;

const baseShort = id => { const B = BUILTIN.find(t => t.id === id); return !B || B.kind === "all" ? "National" : B.kind === "gen" ? B.big : B.card; };
const CT_FORM_LBL = {mega:"Megas only", regional:"Regional forms only", only:"Forms only", hide:"No forms"};

function suggestFor(T, members, probs){

    if (have.has(m.num) || bases.has(baseOf(m.num)) || !isFE(m.num) || (!legendTeam && isLegend(m.num))) continue;
    let sc = 0, bad = false;
    for (const a of probs) { const e = eff(a, m.types, T.chart); if (e > 1) { bad = true; break; } sc += e === 0 ? 14 : e < 1 ? 10 : 0; }
    if (bad || !sc) continue;

  scored.sort((a, b) => b[0] - a[0]);
