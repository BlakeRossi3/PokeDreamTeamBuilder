<meta charset="utf-8">
<title>Dream Team Dex</title>
<meta name="description" content="Build Pokémon dream teams for every region, stage Hall of Fame scenes, battle Gym Leaders and play quizzes, in 2D pixel art or 3D.">
<meta name="theme-color" content="#0e1729">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Rubik:wght@400;500;600;700&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/*@CSS*/
</style>

<!-- ================= START ================= -->
<section class="start" id="start">
  <div class="corner-btns"><button class="snd" type="button" data-snd aria-label="Sound"></button><button class="snd" type="button" data-gear aria-label="Settings" title="Settings"></button></div>
  <canvas class="start-canvas" id="startCanvas" aria-label="Your all-gen team in its Hall of Fame scene"></canvas>
  <div class="start-shade" aria-hidden="true"></div>
  <div class="start-ui">
    <div class="logo" role="img" aria-label="Dream Team Dex">
      <span class="lw l2">DREAM</span><span class="emblem" aria-hidden="true"><i class="e2"></i><i class="e3"></i></span><span class="lw l3">TEAM</span>
      <span class="dex-tag" aria-hidden="true">DEX</span>
    </div>
    <div class="start-bottom">
      <p class="start-team" id="startTeam"></p>
      <div class="start-ctrl">
        <div class="mode-switch" role="group" aria-label="Choose a style">
          <button type="button" data-sm="2d" aria-pressed="false"><b>2D</b><span>Pixel</span></button>
          <button type="button" data-sm="3d" aria-pressed="true"><b>3D</b><span>Modern</span></button>
        </div>
        <button class="fsbtn start-fs" type="button" data-fs aria-label="Full screen" title="Full screen"><span class="fs-ic" aria-hidden="true"></span></button>
        <button class="play" type="button" id="playBtn">Play <span class="arr" aria-hidden="true">→</span></button>
      </div>
      <div class="start-foot">
        <span id="startAcct"></span>
        <span id="startSample" hidden>Showing a sample team.</span>
        <button class="linkbtn" type="button" id="startEdit">Edit all-gen team</button>
        <button class="linkbtn" type="button" id="startScene">Edit this scene</button>
      </div>
    </div>
    <div class="hub" id="hub">
      <nav class="hub-grid" id="hubGrid" aria-label="Main menu"></nav>
      <button class="hub-today" type="button" id="hubToday" hidden></button>
      <div class="hub-foot"><button class="linkbtn" type="button" id="hubBack">← Title screen</button><span id="hubWho"></span><button class="linkbtn" type="button" id="hubHelp">How to play</button><button class="linkbtn" type="button" data-gear>Settings</button></div>
    </div>
  </div>
</section>

<!-- ================= SCREENS (battle, quiz, settings…) ================= -->
<section class="screen" id="screen" hidden>
  <header class="sc-top"><button class="btn sm" type="button" id="scBack" aria-label="Back to the menu">←<span class="bk-t"> Menu</span></button><h2 id="scTitle"></h2><span class="home-pp sc-pp" id="scPP" title="Your PokéPoints"></span><span class="sc-right"><button class="snd" type="button" data-snd aria-label="Sound"></button><button class="btn sm fsbtn" type="button" data-fs aria-label="Full screen" title="Full screen"><span class="fs-ic" aria-hidden="true"></span></button></span></header>
  <main class="sc-body" id="scBody"></main>
</section>

<!-- ================= SIGN IN ================= -->
<section class="acc-screen" id="acc" hidden aria-labelledby="accLogo">
  <div class="acc-wrap">
    <div class="acc-logo" id="accLogo" role="img" aria-label="Dream Team Dex"><span class="l2">DREAM</span><span class="emblem" aria-hidden="true"><i class="e2"></i><i class="e3"></i></span><span class="l3">TEAM</span></div>
    <p class="acc-tag">Build Pokémon dream teams · Battle · Play</p>
    <div class="acc-card" id="accBody"></div>
  </div>
</section>

<!-- ================= APP ================= -->
<div class="app" id="app" hidden>
  <header class="top">
    <button class="brand" type="button" id="homeBtn" aria-label="Back to the menu">
      <span class="ball" aria-hidden="true"></span>
      <span><h1>Dream Team Dex</h1><p class="sub">Nine regions, nine collections and as many custom teams as you like.</p></span>
    </button>
    <div class="controls">
      <div class="seg" role="group" aria-label="Sprite style">
        <button id="m2d" type="button" aria-pressed="false">2D<span class="k">Pixel</span></button>
        <button id="m3d" type="button" aria-pressed="true">3D<span class="k">Modern</span></button>
      </div>
      <button class="toggle fsbtn" type="button" data-fs aria-label="Full screen" title="Full screen"><span class="fs-ic" aria-hidden="true"></span></button>
      <button id="shinyBtn" class="toggle" type="button" aria-pressed="false" title="Show every sprite as shiny"><span class="spark" aria-hidden="true">✦</span>Shiny</button>
      <button id="acctBtn" class="acct" type="button" data-s="local" aria-label="Account"><span class="acct-av" id="acctAv" hidden></span><span class="dot" aria-hidden="true"></span><span class="t" id="acctText">Sign in</span></button>
    </div>
  </header>

  <div class="tabs-wrap"><nav class="tabs" id="tabs" aria-label="Teams"></nav></div>

  <main class="layout" id="layout">
    <section class="panel team-panel" aria-labelledby="teamH">
      <div class="ph"><h2 id="teamH">Kanto dream team</h2><span class="right"><span class="meta" id="teamCount">0 / 6</span><button class="btn sm plain more" type="button" id="teamMore" aria-label="Team options: rating, notes and share code" title="Rating, notes and share code">⋯</button><button class="btn sm plain" type="button" id="hideTeam" aria-label="Hide team panel">Hide ‹</button></span></div>
      <div class="trow" id="trow"></div>
      <div class="slots" id="slots"></div>
      <div class="actions">
        <button class="btn primary" id="randomBtn" type="button">Random six</button>
        <button class="btn" id="clearBtn" type="button">Clear team</button>
        <button class="btn undo" id="undoBtn" type="button" disabled aria-label="Undo" title="Nothing to undo">↶ Undo</button>
      </div>
      <div class="cov">
        <button class="cov-toggle" id="covToggle" type="button" aria-expanded="false" aria-controls="covBody">
          <span class="cov-title">Type coverage</span><span id="covSum"></span><span class="chev" aria-hidden="true">▾</span>
        </button>
        <div class="cov-body" id="covBody" hidden></div>
      </div>
    </section>

    <section class="panel dex-panel" id="dexPanel" aria-labelledby="dexH">
      <div class="party" id="party"></div>
      <div class="ph"><h2 id="dexH">Kanto Pokédex</h2><span class="meta" id="dexMeta"></span></div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="Search name, number or type" autocomplete="off" aria-label="Search Pokémon" title="Press / to search">
        <select class="select" id="sort" aria-label="Sort Pokémon">
          <option value="dex">Dex number</option>
          <option value="fav">Favorites first</option>
          <option value="name">Name A–Z</option>
          <option value="bst">Base stat total</option>
          <option value="s0">Highest HP</option>
          <option value="s1">Highest Attack</option>
          <option value="s2">Highest Defense</option>
          <option value="s3">Highest Sp. Atk</option>
          <option value="s4">Highest Sp. Def</option>
          <option value="s5">Highest Speed</option>
        </select>
        <button class="favchip fbtn" id="filterBtn" type="button" aria-expanded="false" aria-controls="fpanel"><span aria-hidden="true">≡</span> Filters <span class="fbadge" id="fBadge" hidden>0</span></button>
      </div>
      <div class="fpanel" id="fpanel" hidden role="group" aria-label="Filters"></div>
      <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
      <div class="progress" id="progress" hidden><span id="progText">Loading sprites…</span><span class="track"><i id="progBar"></i></span></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>
</div>

<div class="tip" id="tip" hidden></div>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<div class="overlay" id="hof" hidden role="dialog" aria-modal="true" aria-label="Hall of Fame scene">
  <canvas id="hofCanvas" aria-label="Animated Hall of Fame scene. Drag Pokémon to move them."></canvas>
  <div class="ov-bar">
    <span class="ov-name" id="hofName">Hall of Fame</span>
    <button class="btn sm" type="button" id="hofEdit" aria-pressed="false">✎ Edit scene</button>
    <button class="btn sm" type="button" id="hofGif">Save GIF</button>
    <button class="btn sm" type="button" id="hofPng">Save PNG</button>
    <button class="btn sm fsbtn" type="button" data-fs aria-label="Full screen" title="Full screen"><span class="fs-ic" aria-hidden="true"></span></button>
    <button class="btn sm" type="button" id="hofClose" aria-label="Close Hall of Fame">✕</button>
  </div>
  <aside class="hof-panel" id="hofPanel" hidden aria-label="Scene settings"></aside>
  <div class="hof-sel" id="hofSel" hidden></div>
  <div class="hof-hint" id="hofHint">Drag your Pokémon and trainer to move them. Tap one to resize or flip it.</div>
  <div class="ov-status" id="hofStatus" role="status" hidden></div>
</div>
<div class="overlay vt" id="view" hidden role="dialog" aria-modal="true" aria-labelledby="vtTitle">
  <div class="vt-main">
    <header class="vt-top">
      <div class="vt-head"><span class="k" id="vtSub"></span><h2 id="vtTitle">Your team</h2></div>
      <div class="vt-actions"><button class="btn sm" type="button" id="viewHof">🏆 Hall of Fame</button><button class="btn sm" type="button" id="viewClose" aria-label="Close team view">✕</button></div>
    </header>
    <div class="vt-stage"><div class="vt-trainer" id="vtTrainer"></div><div class="vt-slots" id="vtSlots"></div></div>
  </div>
  <aside class="view-panel" id="viewPanel" aria-label="Stats"></aside>
</div>

<script src="gifkit.js"></script>
<script>
/*@JS*/
</script>
